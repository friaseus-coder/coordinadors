<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Gestió Vacances</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/services.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .main-container {
        display: flex;
        flex: 1;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
    }

    .form-panel {
        width: 380px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: fit-content;
    }

    .list-panel {
        flex: 1;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    h2 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    label {
        font-weight: 700;
        color: var(--nyn-verd);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, button {
        font-family: inherit;
        font-size: 11.5px;
        box-sizing: border-box;
    }

    input[type="text"], input[type="date"], select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        width: 100%;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="date"]:focus, select:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-nyn:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    .btn-danger-icon {
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-danger-icon:hover {
        color: #b91c1c;
    }

    /* Tabla */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f8fafc;
        color: var(--text-main);
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        padding: 10px 12px;
        border-bottom: 2px solid var(--border);
        text-align: left;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }
</style>
</head>
<body x-data="moduloVacaciones()" x-init="init()">

<header>
    <div class="header-center"><i class="fas fa-umbrella-beach mr-2"></i> GESTIÓ DE VACANCES</div>
</header>

<div class="main-container">
    <!-- Panel Izquierdo: Registrar Vacaciones -->
    <div class="form-panel">
        <h2><i class="fas fa-calendar-plus"></i> Nova Sol·licitud</h2>
        
        <div class="flex flex-col gap-1.5">
            <label>Treballador</label>
            <select x-model="nuevaSolicitud.agente">
                <option value="">-- Selecciona --</option>
                <template x-for="t in listaAgentes" :key="t">
                    <option :value="t" x-text="t"></option>
                </template>
            </select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label>Fecha Inicio</label>
            <input type="date" x-model="nuevaSolicitud.fecha_inicio">
        </div>

        <div class="flex flex-col gap-1.5">
            <label>Fecha Fin (Opcional)</label>
            <input type="date" x-model="nuevaSolicitud.fecha_fin">
        </div>

        <div class="flex flex-col gap-1.5">
            <label>Estado</label>
            <select x-model="nuevaSolicitud.estado">
                <option value="Aprobado">Aprobado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Rechazado">Rechazado</option>
            </select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label>Comentaris</label>
            <input type="text" x-model="nuevaSolicitud.comentarios" placeholder="Ej: Vacances estiu, pont...">
        </div>

        <button class="btn-nyn w-full mt-2" @click="registrarSolicitud()">
            <i class="fas fa-save"></i> Registrar Vacances
        </button>
    </div>

    <!-- Panel Derecho: Listado Solicitudes -->
    <div class="list-panel">
        <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-2">
            <h2><i class="fas fa-list"></i> Sol·licituds Registrades</h2>
            
            <div class="flex gap-2">
                <select x-model="filtros.anio" style="width: 100px; height: 26px;">
                    <option value="">Tots els anys</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
                
                <select x-model="filtros.agente" style="width: 160px; height: 26px;">
                    <option value="ALL">Tots els agents</option>
                    <template x-for="t in listaAgentes" :key="t">
                        <option :value="t" x-text="t"></option>
                    </template>
                </select>

                <select x-model="filtros.estado" style="width: 120px; height: 26px;">
                    <option value="ALL">Tots els estats</option>
                    <option value="Aprobado">Aprobado</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Rechazado">Rechazado</option>
                </select>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th>Treballador</th>
                        <th width="100">Fecha Inicio</th>
                        <th width="100">Fecha Fin</th>
                        <th width="110">Estado</th>
                        <th>Comentarios</th>
                        <th width="80" class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="inc in incidenciasFiltradas" :key="inc.id">
                        <tr>
                            <td class="font-bold text-gray-800" x-text="inc.id_trabajador"></td>
                            <td x-text="inc.fecha_inicio"></td>
                            <td x-text="inc.fecha_fin || '-'"></td>
                            <td>
                                <select :value="inc.estado" @change="cambiarEstado(inc.id, $event.target.value)" 
                                        :class="{
                                            'bg-green-100 text-green-800 border-green-300 font-semibold': inc.estado === 'Aprobado',
                                            'bg-yellow-100 text-yellow-800 border-yellow-300 font-semibold': inc.estado === 'Pendiente',
                                            'bg-red-100 text-red-800 border-red-300 font-semibold': inc.estado === 'Rechazado'
                                        }" style="height: 24px; padding: 2px 6px;">
                                    <option value="Aprobado">Aprobado</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Rechazado">Rechazado</option>
                                </select>
                            </td>
                            <td class="text-gray-600" x-text="inc.comentarios || '-'"></td>
                            <td class="text-center">
                                <button class="btn-danger-icon" @click="eliminarSolicitud(inc.id)">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </template>
                    <template x-if="incidenciasFiltradas.length === 0">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-400">
                                <i class="fas fa-info-circle mb-1 text-lg"></i><br>
                                No hay solicitudes de vacaciones registradas con los filtros seleccionados.
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="./js/vacances.js"></script>
</body>
</html>
