<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Configurar Regles de Negoci</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .main-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
    }

    .section-card {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    h2 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    label {
        font-weight: 700;
        color: var(--nyn-verd);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, button, textarea {
        font-family: inherit;
        font-size: 11.5px;
        box-sizing: border-box;
    }

    input[type="text"], input[type="date"], select, textarea {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        width: 100%;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 28px;
    }

    .btn-nyn:hover:not(:disabled) {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-nyn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    .btn-danger-icon {
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-danger-icon:hover {
        color: #b91c1c;
    }

    /* Tabla */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f8fafc;
        color: var(--text-main);
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        padding: 10px 12px;
        border-bottom: 2px solid var(--border);
        text-align: left;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11.5px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 24px;
        border-radius: 6px;
        color: white;
        font-weight: 600;
        z-index: 3000;
        box-shadow: var(--shadow-md);
        display: none;
    }
    .toast.success { background-color: var(--nyn-verd-accent); }
    .toast.error { background-color: #ef4444; }
</style>
</head>
<body x-data="moduloReglas()" x-init="init()">

<header>
    <div class="header-center"><i class="fas fa-gavel mr-2"></i> REGLES DE NEGOCI I COBERTURES</div>
</header>

<div class="main-container">
    <!-- SECCIÓN 1: REGLAS DE NEGOCIO -->
    <div class="section-card">
        <div class="flex justify-between items-center border-b pb-2 mb-2">
            <h2><i class="fas fa-sliders-h"></i> Paràmetres del Sistema</h2>
            <button class="btn-nyn" :disabled="!hasChanges" @click="saveChanges()">
                <i class="fas fa-save mr-1"></i> Desar Canvis
            </button>
        </div>

        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th width="150">Clave</th>
                        <th width="120">Categoria</th>
                        <th width="150">Valor</th>
                        <th>Descripció</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="rule in rules" :key="rule.clave">
                        <tr>
                            <td class="font-mono font-bold text-slate-700" x-text="rule.clave"></td>
                            <td>
                                <span class="bg-gray-100 text-gray-700 font-semibold px-2 py-0.5 rounded text-[10px]" x-text="rule.categoria"></span>
                            </td>
                            <td>
                                <!-- Valor Booleano -->
                                <template x-if="rule.tipo === 'booleano'">
                                    <select :value="rule.value" @change="trackEdit(rule.clave, $event.target.value)" :disabled="userRole !== 'jefe operaciones'">
                                        <option value="0">No (0)</option>
                                        <option value="1">Sí (1)</option>
                                    </select>
                                </template>

                                <!-- Valor Numérico -->
                                <template x-if="rule.tipo === 'numero'">
                                    <input type="number" :value="rule.value" @input="trackEdit(rule.clave, $event.target.value)" :disabled="userRole !== 'jefe operaciones'">
                                </template>

                                <!-- Valor Texto o General -->
                                <template x-if="rule.tipo !== 'booleano' && rule.tipo !== 'numero'">
                                    <input type="text" :value="rule.value" @input="trackEdit(rule.clave, $event.target.value)" :disabled="userRole !== 'jefe operaciones'">
                                </template>
                            </td>
                            <td class="text-gray-500 text-xs" x-text="rule.descripcion"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Formulario añadir regla (Sólo Jefe Operaciones) -->
        <div x-show="userRole === 'jefe operaciones'" class="mt-4 bg-slate-50 p-4 border rounded-lg flex flex-col gap-4">
            <h3 class="text-xs font-bold text-slate-700 uppercase" style="margin: 0;"><i class="fas fa-plus-circle mr-1"></i> Nova Regla</h3>
            <div class="grid grid-cols-4 gap-4">
                <div class="flex flex-col gap-1">
                    <label>Clave</label>
                    <select x-model="nuevaRegla.clave" @change="onClaveChange()">
                        <option value="">-- Selecciona una clave --</option>
                        <option value="max_horas_semanales">max_horas_semanales</option>
                        <option value="max_dias_mensuales">max_dias_mensuales</option>
                        <option value="permitir_vacio_laborables">permitir_vacio_laborables</option>
                        <option value="bloquear_cruce_sociedades">bloquear_cruce_sociedades</option>
                        <option value="min_horas_descanso_entre_turnos">min_horas_descanso_entre_turnos</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label>Categoria</label>
                    <select x-model="nuevaRegla.categoria">
                        <option value="GENERAL">GENERAL</option>
                        <option value="VALIDACIÓN">VALIDACIÓN</option>
                        <option value="NOTIFICACIONES">NOTIFICACIONES</option>
                        <option value="RANGOS">RANGOS</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label>Tipo</label>
                    <select x-model="nuevaRegla.tipo" @change="adjustValueInput()">
                        <option value="texto">Texto</option>
                        <option value="numero">Número</option>
                        <option value="booleano">Booleano</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label>Valor Inicial</label>
                    <template x-if="nuevaRegla.tipo === 'booleano'">
                        <select x-model="nuevaRegla.value" style="height: 28px;">
                            <option value="0">No (0)</option>
                            <option value="1">Sí (1)</option>
                        </select>
                    </template>
                    <template x-if="nuevaRegla.tipo === 'numero'">
                        <input type="number" x-model="nuevaRegla.value">
                    </template>
                    <template x-if="nuevaRegla.tipo !== 'booleano' && nuevaRegla.tipo !== 'numero'">
                        <input type="text" x-model="nuevaRegla.value">
                    </template>
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <label>Descripción</label>
                <textarea x-model="nuevaRegla.descripcion" rows="2" placeholder="Explica la utilidad de este parámetro..."></textarea>
            </div>
            <button class="btn-nyn self-end" @click="addRule()"><i class="fas fa-plus"></i> Afegir Regla</button>
        </div>
    </div>

    <!-- SECCIÓN 2: COBERTURAS OBLIGATORIAS -->
    <div class="section-card">
        <h2><i class="fas fa-shield-alt"></i> Cobertures Obligatòries Específiques</h2>

        <div class="grid grid-cols-3 gap-6 items-start mt-2">
            <!-- Formulario nueva cobertura (Sólo Jefe Operaciones) -->
            <div class="bg-slate-50 p-4 border rounded-lg flex flex-col gap-4" x-show="userRole === 'jefe operaciones'">
                <h3 class="text-xs font-bold text-slate-700 uppercase" style="margin:0;"><i class="fas fa-plus-circle mr-1"></i> Nova Cobertura</h3>
                
                <div class="flex flex-col gap-1">
                    <label>Centre / Pàrquing</label>
                    <select x-model="nuevaCobertura.aparcamiento_id">
                        <template x-for="ap in aparcamientos" :key="ap.id">
                            <option :value="ap.id" x-text="ap.nombre"></option>
                        </template>
                    </select>
                </div>

                <div class="flex flex-col gap-1">
                    <label>Fecha obligatoria</label>
                    <input type="date" x-model="nuevaCobertura.fecha">
                </div>

                <div class="flex flex-col gap-1">
                    <label>Turno</label>
                    <select x-model="nuevaCobertura.turno" @change="adjustCoberturaHorario()">
                        <option value="MATÍ">MATÍ</option>
                        <option value="TARDA">TARDA</option>
                        <option value="NIT">NIT</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col gap-1">
                        <label>Hora Inicio</label>
                        <input type="text" x-model="nuevaCobertura.hora_inicio">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label>Hora Fin</label>
                        <input type="text" x-model="nuevaCobertura.hora_fin">
                    </div>
                </div>

                <button class="btn-nyn w-full mt-2" @click="addCobertura()"><i class="fas fa-save mr-1"></i> Registrar Cobertura</button>
            </div>

            <!-- Listado de Coberturas -->
            <div class="overflow-x-auto col-span-2">
                <table>
                    <thead>
                        <tr>
                            <th>Centre</th>
                            <th>Fecha</th>
                            <th>Torn</th>
                            <th>Horari</th>
                            <th x-show="userRole === 'jefe operaciones'" width="60" class="text-center">Eliminar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="cob in coberturas" :key="cob.id">
                            <tr>
                                <td class="font-bold text-gray-800" x-text="cob.aparcamiento_nombre"></td>
                                <td x-text="cob.fecha"></td>
                                <td>
                                    <span class="bg-purple-100 text-purple-800 font-semibold px-2 py-0.5 rounded text-[10px]" x-text="cob.turno"></span>
                                </td>
                                <td class="font-mono text-gray-600 font-semibold" x-text="cob.hora_inicio + ' - ' + cob.hora_fin"></td>
                                <td x-show="userRole === 'jefe operaciones'" class="text-center">
                                    <button class="btn-danger-icon" @click="deleteCobertura(cob.id)">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="coberturas.length === 0">
                            <tr>
                                <td :colspan="userRole === 'jefe operaciones' ? 5 : 4" class="text-center py-6 text-gray-400">
                                    No hi ha cobertures obligatories definides per a aquest mes.
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- TOAST ALERT -->
<div class="toast success" :style="showToast ? 'display:block;' : 'display:none;'" x-text="toastMessage"></div>

<script src="./js/regles.js"></script>
</body>
</html>
