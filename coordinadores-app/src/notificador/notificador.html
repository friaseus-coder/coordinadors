<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Comunicacions - NN Parkings</title>
    <style>
        :root { --verd-notificador: #2d5a27; --groc-distintiu: #ffcc00; --fons: #ffffff; }
        body { font-family: 'Verdana', sans-serif; font-size: 15px; margin: 0; padding: 10px; background-color: #f0f2f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .contenedor-app { background-color: var(--fons); width: 100%; max-width: 650px; border: 4px solid var(--groc-distintiu); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); overflow: hidden; }
        .capçalera-app { background-color: var(--verd-notificador); color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--groc-distintiu); }
        .capçalera-titol { margin: 0; text-transform: uppercase; font-size: 16px; font-weight: bold; }
        .capçalera-logo { height: 35px; }
        .formulari-app { padding: 15px 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--verd-notificador); font-size: 12px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-left: 5px solid var(--verd-notificador); border-radius: 4px; font-size: 14px; }
        .seccio-extra { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px dashed var(--verd-notificador); display: none; }
        
        .selector-tipus { display: flex; gap: 10px; margin-top: 10px; }
        .opcio-tipus { flex: 1; padding: 10px; border: 2px solid #ccc; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; background: #f9f9f9; font-size: 12px; }
        .opcio-tipus.active { border-color: var(--verd-notificador); background-color: #e8f5e9; color: var(--verd-notificador); }

        .btn-principal { width: 100%; padding: 16px; background-color: var(--verd-notificador); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #teclat-popover { display: none; background: #e1e4e8; padding: 8px; border-radius: 8px; margin-top: 8px; border: 2px solid #abb2b9; }
        .teclat-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
        .tecla { background: white; border: 1px solid #999; padding: 10px 0; text-align: center; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 14px; user-select: none; }
        .tecla:hover { background: var(--groc-distintiu); }
        .tecla.delete { background: #f8d7da; color: #721c24; }
        .tecla.intro { background: #2d5a27; color: white; grid-column: span 2; font-size: 18px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: normal; text-transform: none; color: #333; }
        .checkbox-item input { width: auto; margin: 0; }
        .radio-group { display: flex; gap: 15px; margin-top: 10px; margin-bottom: 10px; }
        .radio-item { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: normal; text-transform: none; }
        .radio-item input { width: auto; margin: 0; }
    </style>
</head>
<body>

        <label>2. Tipus de Contracte:</label>
        <div class="selector-tipus">
            <div id="btn-vehiculo" class="opcio-tipus active" onclick="seleccionarTipus('vehicle')">VEHICLE</div>
            <div id="btn-trastero" class="opcio-tipus" onclick="seleccionarTipus('trastero')">TRASTER</div>
        </div>
        <input type="hidden" id="tipus-contracte" value="vehicle">

        <label>3. Motiu del Comunicat:</label>
        <select id="notif-reason" onchange="comprovarMotiu()">
            <optgroup label="Avisos Generales y Normativa">
                <option value="bienvenida">Bienvenida y normativa</option>
                <option value="fuera_de_plaza">Vehículo mal aparcado</option>
                <option value="vehiculo_diferente">Vehículo diferente o sin tarjeta</option>
                <option value="elementos">Objetos en la plaza</option>

                <option value="luces_encendidas">Aviso luces/ventanas/aceite</option>
            </optgroup>
            <optgroup label="Incidències">
                <option value="siniestro">Siniestro o accidente</option>
                <option value="moto_en_plaza">Moto en plaza de coche</option>
                <option value="mala_circulacion">Mala circulación</option>

        </div>

</div>

    function seleccionarTipus(t) {
        document.getElementById('tipus-contracte').value = t;
        document.getElementById('btn-vehiculo').classList.toggle('active', t === 'vehicle');
        document.getElementById('btn-trastero').classList.toggle('active', t === 'trastero');
        
        const selectorMotiu = document.getElementById('notif-reason');
        const inputExtra = document.getElementById('extra-info');

        if (t === 'trastero') {
            selectorMotiu.value = "bienvenida";
            inputExtra.placeholder = "Nº de Traster...";
            Array.from(selectorMotiu.options).forEach(opt => {
                if(opt.value !== "bienvenida") opt.disabled = true;
            });
            comprovarMotiu();
        } else {
            inputExtra.placeholder = "Matrícula...";
            Array.from(selectorMotiu.options).forEach(opt => opt.disabled = false);
        }
    }

    function comprovarMotiu() {
        const m = document.getElementById('notif-reason').value;
        document.getElementById('seccio-velocitat').style.display = (m === 'mala_circulacion') ? 'block' : 'none';
        document.getElementById('seccio-comportament').style.display = (m === 'comportamiento') ? 'block' : 'none';
        document.getElementById('seccio-tarifas').style.display = (m === 'tarifas') ? 'block' : 'none';
        document.getElementById('seccio-cobro').style.display = (m === 'incidencia_cobro') ? 'block' : 'none';
        document.getElementById('seccio-baja-plazo').style.display = (m === 'baja_fuera_plazo') ? 'block' : 'none';
        document.getElementById('seccio-acces').style.display = (m === 'vehiculo_diferente') ? 'block' : 'none';
        document.getElementById('seccio-llums').style.display = (m === 'luces_encendidas') ? 'block' : 'none';
        document.getElementById('seccio-equipament').style.display = (m === 'abonado_con_ticket') ? 'block' : 'none';
        document.getElementById('seccio-robo').style.display = (m === 'queja_robo_cristales') ? 'block' : 'none';
    }

            const esRecurrente = document.getElementById('vel-frecuencia').value === 'Hecho recurrente';
            const esVelocidad = document.getElementById('vel-tipus').value === 'Velocidad excesiva';
            const f = document.getElementById('vel-dia').value;
            const dataF = f ? f.split('-').reverse().join('/') : "[FECHA]";
            const nomPark = centre.split(' - ').slice(1).join(' - ');

            const tipusCA = esVelocidad ? "a una velocitat excessiva" : "en contra direcció";
            const tipusES = esVelocidad ? "a una velocidad excesiva" : "en contra dirección";
            const tipusEN = esVelocidad ? "at an excessive speed" : "in the wrong direction";

            textObj.ca = `Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament ${nomPark}.\n\n` + 
                (esRecurrente 
                    ? `L'informem que hem detectat de manera recurrent, i concretament el passat dia ${dataF}, que circulava per l'aparcament ${tipusCA}.` 
                    : `L'informem que el passat dia ${dataF} vam detectar que circulava per l'aparcament ${tipusCA}.`) + 
                " Per la seguretat de tots els usuaris, li preguem que es cenyeixi a les normes de circulació i senyalització de l'aparcament en tot moment.\n\nPer a qualsevol dubte, pot respondre a aquest mateix correu, posant en còpia si ho desitja a info@nnparkings.com.\n\nMoltes gràcies per la seva col·laboració.\n\nAtentament,";

            textObj.es = `Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento ${nomPark}.\n\n` + 
                (esRecurrente 
                    ? `Le informamos que hemos detectado de forma recurrente, y concretamente el pasado día ${dataF}, que circulaba por el aparcamiento ${tipusES}.` 
                    : `Le informamos que el pasado día ${dataF} detectamos que circulaba por el aparcamiento ${tipusES}.`) + 
                " Por la seguridad de todos los usuarios, le rogamos que se ciña a las normas de circulación y señalización del aparcamiento en todo momento.\n\nPara cualquier duda, puede responder a este mismo correo, poniendo en copia si lo desea a info@nnparkings.com.\n\nMuchas gracias por su colaboración.\n\nAtentamente,";

            textObj.en = `Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at ${nomPark} Car Park.\n\n` + 
                (esRecurrente 
                    ? `We inform you that we have repeatedly detected, and specifically on ${dataF}, that you were driving through the car park ${tipusEN}.` 
                    : `We inform you that on ${dataF} we detected that you were driving through the car park ${tipusEN}.`) + 
                " For the safety of all users, we ask you to adhere to the car park's traffic rules and signage at all times.\n\nFor any questions, you can reply to this email, and you can also copy info@nnparkings.com if you wish.\n\nThank you for your cooperation.\n\nSincerely,";
        } else if (motiuClau === 'abonado_con_ticket') {
            const teLector = document.getElementById('chk-lector-matricula').checked;
            if (teLector) {
                textObj.ca = "Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament [PARKING].\n\nL'informem que hem detectat que accedeix habitualment a l'aparcament recollint un tiquet de rotació en comptes d'utilitzar la seva targeta d'abonat. Li recordem que la seva targeta és l'element de rescat obligatori en cas que el sistema de lectura de matrícules no reconegui el seu vehicle. L'ús del tiquet genera desajustos en el sistema de control d'abonaments.\n\nPer a qualsevol dubte, pot respondre a aquest mateix correu, posant en còpia si ho desitja a info@nnparkings.com.\n\nMoltes gràcies per la seva col·laboració.\n\nAtentament,";
                textObj.es = "Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento [PARKING].\n\nLe informamos que hemos detectado que accede habitualmente al aparcamiento recogiendo un ticket de rotación en lugar de utilizar su tarjeta de abonado. Le recordamos que su tarjeta es el elemento de rescate obligatorio en caso de que el sistema de lectura de matrículas no reconozca su vehículo. El uso del ticket genera desajustes en el sistema de control de abonos.\n\nPara cualquier duda, puede responder a este mismo correo, poniendo en copia si lo desea a info@nnparkings.com.\n\nMuchas gracias por su colaboración.\n\nAtentamente,";
                textObj.en = "Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at [PARKING] Car Park.\n\nWe inform you that we have detected that you regularly access the car park by taking a rotation ticket instead of using your subscriber card. We remind you that your card is the mandatory rescue element in case the license plate recognition system does not recognize your vehicle. Using a rotation ticket causes discrepancies in the subscription control system.\n\nFor any questions, you can reply to this email, and you can also copy info@nnparkings.com if you wish.\n\nThank you for your cooperation.\n\nSincerely,";
            } else {
                textObj.ca = "Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament [PARKING].\n\nL'informem que hem detectat que accedeix habitualment a l'aparcament recollint un tiquet de rotació. Li recordem que l'accés per a abonats s'ha de realitzar sempre mitjançant la seva targeta d'accés per tal de mantenir el correcte funcionament del seu abonament.\n\nPer a qualsevol dubte, pot respondre a aquest mateix correu, posant en còpia si ho desitja a info@nnparkings.com.\n\nMoltes gràcies per la seva col·laboració.\n\nAtentament,";
                textObj.es = "Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento [PARKING].\n\nLe informamos que hemos detectado que accede habitualmente al aparcamiento recogiendo un ticket de rotación. Le recordamos que el acceso para abonados debe realizarse siempre mediante su tarjeta de acceso para mantener el correcto funcionamiento de su abono.\n\nPara cualquier duda, puede responder a este mismo correo, poniendo en copia si lo desea a info@nnparkings.com.\n\nMuchas gracias por su colaboración.\n\nAtentamente,";
                textObj.en = "Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at [PARKING] Car Park.\n\nWe inform you that we have detected that you regularly access the car park by taking a rotation ticket. We remind you that subscriber access must always be performed using your access card to maintain the correct operation of your subscription.\n\nFor any questions, you can reply to this email, and you can also copy info@nnparkings.com if you wish.\n\nThank you for your cooperation.\n\nSincerely,";
            }
        } else if (motiuClau === 'queja_robo_cristales') {
            const esRobo = document.getElementById('chk-queja-robo').checked;
            const textDenunciaCA = esRobo ? "\nEn tractar-se d'un robatori, l'informem que la seva assegurança li sol·licitarà la denúncia pertinent, per la qual cosa li recomanem tramitar-la al més aviat possible." : "";
            const textDenunciaES = esRobo ? "\nAl tratarse de un robo, le informamos que su seguro le solicitará la denuncia pertinente, por lo que le recomendamos tramitarla a la mayor brevedad." : "";
            const textDenunciaEN = esRobo ? "\nAs this involves a theft, please be aware that your insurance will require a formal police report, so we recommend you file one as soon as possible." : "";
            textObj.ca = "Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament [PARKING].\n\nLamentem profundament l'incident ocorregut al seu vehicle. Li demanem que informi a la seva companyia d'assegurances perquè valorin si escau realitzar la reclamació corresponent a la nostra entitat." + textDenunciaCA + "\n\nPer a qualsevol informació addicional o per aportar documentació, si us plau contacti amb info@nnparkings.com.\nMoltes gràcies per la seva col·laboració.\n\nAtentament,";
            textObj.es = "Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento [PARKING].\n\nLamentamos profundamente el incidente ocurrido en su vehículo. Le solicitamos que informe a su compañía de seguros para que valoren si procede realizar la reclamación correspondiente a nuestra entidad." + textDenunciaES + "\n\nPara cualquier información adicional o para aportar documentación, por favor contacte con info@nnparkings.com.\nMuchas gracias por su colaboración.\n\nAtentamente,";
            textObj.en = "Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at [PARKING] Car Park.\n\nWe deeply regret the incident involving your vehicle. We request that you inform your insurance company so they can evaluate whether to submit the corresponding claim to our entity." + textDenunciaEN + "\n\nFor any additional information or to provide documentation, please contact info@nnparkings.com.\nThank you for your cooperation.\n\nSincerely,";
        } else if (motiuClau === 'comportamiento') {
            const dest = document.querySelector('input[name="comp-destinatari"]:checked').value;
            const chks = Array.from(document.querySelectorAll('.chk-falta:checked')).map(c => c.value);
            const formatList = (list, lang) => {
                if (list.length === 0) return " ";
                const labels = {
                    ca: { insults: "insults", respecte: "falta de respecte", agressio: "agressió" },
                    es: { insults: "insultos", respecte: "falta de respeto", agressio: "agresión" },
                    en: { insults: "insults", respecte: "lack of respect", agressio: "aggression" }
                };
                const words = list.map(val => labels[lang][val]);
                if (words.length === 1) return words[0] + " ";
                const last = words.pop();
                const conj = lang === 'en' ? ' and ' : ' i ';
                return words.join(', ') + conj + last + " ";
            };
            const destText = {
                ca: dest === 'personal' ? "el personal de l'aparcament" : "altres clients",
                es: dest === 'personal' ? "al personal del aparcamiento" : "a otros clientes",
                en: dest === 'personal' ? "car park staff" : "other customers"
            };
            textObj.ca = `Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament [PARKING].\n\nCom a continuació de la notificació de baixa que ja ha rebut, volem emfatitzar que aquesta mesura és una conseqüència directa dels fets ocorreguts el passat dia [FECHA], en què es van produir ${formatList(chks, 'ca')}cap a ${destText.ca}. NN Parkings manté una política de tolerància zero davant d'aquest tipus de comportaments per garantir el benestar i la seguretat a les nostres instal·lacions.\nMoltes gràcies per la seva col·laboració.\n\nAtentament,`;
            textObj.es = `Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento [PARKING].\n\nComo continuación de la notificación de baja que ya ha recibido, queremos enfatizar que esta medida es una consecuencia directa de los hechos ocurridos el pasado día [FECHA], en los que se produjeron ${formatList(chks, 'es')}hacia ${destText.es}. NN Parkings mantiene una política de tolerancia cero ante este tipo de comportamientos para garantizar el bienestar y la seguridad en nuestras instalaciones.\nMuchas gracias por su colaboración.\n\nAtentamente,`;
            textObj.en = `Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at [PARKING] Car Park.\n\nAs a follow-up to the cancellation notice you have already received, we wish to emphasize that this measure is a direct consequence of the events that occurred on [FECHA], involving ${formatList(chks, 'en')}towards ${destText.en}. NN Parkings maintains a zero-tolerance policy against such behavior to ensure the well-being and safety within our premises.\nThank you for your cooperation.\n\nSincerely,`;
        } else if (motiuClau === 'luces_encendidas') {
            const chks = Array.from(document.querySelectorAll('.chk-llum:checked')).map(c => c.value);
            if(chks.length === 0) return alert("Marca almenys una opció.");
            let fragCA = [], fragES = [], fragEN = [];
            if(chks.includes('luces')) { fragCA.push("els llums encesos"); fragES.push("las luces encendidas"); fragEN.push("its lights on"); }
            if(chks.includes('ventanas')) { fragCA.push("una o més finestres obertes"); fragES.push("una o más ventanillas abiertas"); fragEN.push("one or more windows open"); }
            if(chks.includes('aceite')) { fragCA.push("una pèrdua d'oli"); fragES.push("una pérdida de aceite"); fragEN.push("an oil leak"); }
            const joiner = (arr, l) => arr.length > 1 ? arr.slice(0, -1).join(', ') + (l === 'en' ? ' and ' : ' i ') + arr.slice(-1) : arr[0];
            textObj.ca = `Bon dia,\n\nApreciat/da client/a,\n\nEns posem en contacte amb vostè en referència al seu abonament a l'Aparcament [PARKING].\n\nL'informem que hem detectat que el seu vehicle té ${joiner(fragCA, 'ca')}. Li preguem que ho revisi tan aviat com sigui possible.\n\nPer a qualsevol dubte, pot respondre a aquest mateix correu, posant en còpia si ho desitja a info@nnparkings.com.\nMoltes gràcies per la seva col·laboració.\n\nAtentament,`;
            textObj.es = `Buenos días,\n\nApreciado/a cliente,\n\nNos ponemos en contacto con usted en referencia a su abono en el Aparcamiento [PARKING].\n\nLe informamos que hemos detectado que su vehículo tiene ${joiner(fragES, 'es')}. Le rogamos que lo revise a la mayor brevedad posible.\n\nPara cualquier duda, puede responder a este mensaje, poniendo en copia si lo desea a info@nnparkings.com.\nMuchas gracias por su colaboración.\n\nAtentamente,`;
            textObj.en = `Good morning,\n\nDear customer,\n\nWe are contacting you regarding your subscription at the [PARKING] Car Park.\n\nWe inform you that we have detected that your vehicle has ${joiner(fragEN, 'en')}. Please check it as soon as possible.\n\nFor any questions, you can reply to this email, and you can also copy info@nnparkings.com if you wish.\nThank you for your cooperation.\n\nSincerely,`;
        } else {
            textObj = JSON.parse(JSON.stringify(TEXTOS[motiuClau] || {ca:"...", es:"...", en:"..."}));
        }

      const nomParkGeneral = centre.split(' - ').slice(1).join(' - ');
        ['ca','es','en'].forEach(l => { 
            if(textObj[l]) {
                textObj[l] = textObj[l].replace(/\[PARKING\]/g, nomParkGeneral);
                
                // MODIFICACIÓ AQUÍ: Afegim 'baja_fuera_plazo' a la condició
                if(motiuClau === 'comportamiento' || motiuClau === 'baja_fuera_plazo'){
                    // Si és baixa agafem 'baja-fecha-efectiva', si és comportament agafem 'comp-data'
                    const idData = (motiuClau === 'baja_fuera_plazo') ? 'baja-fecha-efectiva' : 'comp-data';
                    const f = document.getElementById(idData).value;
                    const dataF = f ? f.split('-').reverse().join('/') : "[FECHA]";
                    textObj[l] = textObj[l].replace(/\[FECHA\]/g, dataF);
                }

                if (motiuClau === 'incidencia_cobro') {
                    textObj[l] = textObj[l].replace(/\[IMPORT\]/g, document.getElementById('cobro-import').value || "[IMPORT]");
                }
            }
        });

        const assumpte = `NN PARKINGS - ${centre}`;
        const cos = `Ref: ${centre}${dadaExtra ? ' | ID: ' + dadaExtra : ''}\n_________________________________\n\nCATALÀ\n-------\n${textObj.ca}\n\n\n\n\nCASTELLANO\n----------\n${textObj.es}\n\n\n\n\nENGLISH\n-------\n${textObj.en}`;
        window.location.href = `mailto:?subject=${encodeURIComponent(assumpte)}&body=${encodeURIComponent(cos)}`;
    }

    const inputField = document.getElementById('extra-info');
    "1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(k => {
        const d = document.createElement('div'); d.className = 'tecla'; d.innerText = k;
        d.onclick = () => { inputField.value += k; }; document.getElementById('grid-keys').appendChild(d);
    });
    const bDel = document.createElement('div'); bDel.className = 'tecla delete'; bDel.innerText = 'DEL';
    bDel.onclick = () => { inputField.value = inputField.value.slice(0, -1); }; document.getElementById('grid-keys').appendChild(bDel);
    const bClose = document.createElement('div'); bClose.className = 'tecla intro'; bClose.innerText = '↵';
    bClose.onclick = () => document.getElementById('teclat-popover').style.display = 'none'; document.getElementById('grid-keys').appendChild(bClose);
    function obrirTeclat() { document.getElementById('teclat-popover').style.display = 'block'; }
</script>
</body>
</html>
