<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Inventari i Logística</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root { 
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --color-consumibles: #3b82f6; 
        --color-ofimatica: #22c55e; 
        --color-manteniment: #eab308; 
        --color-mobiliari: #a855f7;
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        margin: 0; 
        font-size: 11px; 
        display: flex; 
        flex-direction: column; 
        height: 100vh; 
        overflow: hidden; 
    }

    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
        flex-shrink: 0;
    }

    header h1 { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        margin: 0;
    }

    .admin-panel { 
        padding: 10px 24px; 
        display: flex; 
        flex-wrap: wrap;
        gap: 12px; 
        align-items: center; 
        border-bottom: 1px solid var(--border); 
        background: #ffffff; 
        flex-shrink: 0;
    }

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        box-shadow: var(--shadow-sm);
    }

    .filter-label { 
        font-weight: 700; 
        color: var(--nyn-verd); 
        font-size: 10px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }

    select, button, input[type="text"], input[type="number"], input[type="date"] {
        padding: 4px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 500;
        height: 28px;
        box-sizing: border-box;
        background: #ffffff;
        color: #334155;
        outline: none;
    }

    select, button {
        cursor: pointer;
    }

    select:hover, select:focus, input[type="text"]:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-action {
        background: var(--nyn-verd);
        color: #ffffff;
        border: 1px solid var(--nyn-verd);
        font-weight: 600;
    }

    .btn-action:hover {
        background: #0b4e43;
    }

    .btn-action-sec {
        background: #3b82f6;
        color: white;
        border: 1px solid #3b82f6;
        font-weight: 600;
    }

    .btn-action-sec:hover {
        background: #2563eb;
    }

    .btn-archive {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        color: #475569;
    }

    .btn-archive:hover {
        background: #e2e8f0;
    }

    .main-container { 
        display: flex; 
        flex: 1; 
        overflow: hidden; 
        padding: 16px 24px; 
        gap: 16px; 
        background: #f8fafc; 
    }

    .section { 
        background: white; 
        border: 1px solid var(--border); 
        display: flex; 
        flex-direction: column; 
        border-radius: 12px; 
        box-shadow: var(--shadow-md); 
        overflow: hidden; 
    }

    .section-magatzem { width: 550px; } 
    .section-comandes { flex: 1; }

    h2 { 
        background: #f8fafc; 
        margin: 0; 
        padding: 12px 16px; 
        font-size: 12px; 
        font-weight: 700;
        border-bottom: 1px solid var(--border); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        color: var(--nyn-verd); 
        text-transform: uppercase;
    }

    .table-wrapper { flex: 1; overflow-y: auto; padding: 8px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { 
        background: #1e293b; 
        color: white; 
        padding: 8px 4px; 
        border: 1px solid #334155; 
        font-size: 10px; 
        font-weight: 600; 
        text-transform: uppercase; 
        position: sticky; 
        top: 0; 
        z-index: 10; 
    }
    td { padding: 4px 6px; border-bottom: 1px solid #e2e8f0; text-align: center; height: 28px; }

    .row-box { border-left: 4px solid #ccc; }
    .row-consumibles { border-left-color: var(--color-consumibles); }
    .row-ofimatica { border-left-color: var(--color-ofimatica); }
    .row-manteniment { border-left-color: var(--color-manteniment); }
    .row-mobiliari { border-left-color: var(--color-mobiliari); }
    .no-stock-row { background-color: #fef2f2 !important; border-right: 4px solid #ef4444; }

    .btn-qty { width: 22px; height: 22px; cursor: pointer; border: 1px solid #cbd5e1; background: white; font-weight: bold; line-height: 1; border-radius: 4px; }
    .btn-qty:hover { border-color: var(--nyn-verd-accent); color: var(--nyn-verd-accent); }

    .status-btn { padding: 0 4px; border-radius: 6px; font-weight: bold; font-size: 9px; width: 100%; cursor: pointer; height: 22px; border: 1px solid transparent; }
    .pendent { background: #fffbeb; color: #d97706; border-color: #fef3c7; }
    .entregat { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
    
    .delete-btn { cursor: pointer; color: #cbd5e1; font-size: 14px; background: none; border: none; font-weight: bold; transition: color 0.2s; }
    .delete-btn:hover { color: #ef4444; }

    #modalGestio { 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        background: white; 
        padding: 20px; 
        z-index: 2000; 
        box-shadow: var(--shadow-md); 
        width: 700px; 
        max-height: 90vh; 
        border-radius: 12px; 
        border: 2px solid var(--nyn-verd); 
        display: flex;
        flex-direction: column; 
    }
    #modalGestio h3 { color: var(--nyn-verd); margin: 0; font-weight: 700; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; }
</style>
</head>
<body x-data="moduloInventario()" x-init="init()">

<header>
    <h1>📦 INVENTARI I LOGÍSTICA</h1>
</header>

<div class="admin-panel">
    <div class="toolbar-group">
        <span class="filter-label">Dades:</span>
        <button class="btn-archive" @click="document.getElementById('importFile').click()">📂 Importar</button>
        <button class="btn-archive" @click="exportarJSON()">💾 Exportar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" @change="importarJSON($event)">
    </div>
    
    <div class="toolbar-group">
        <button class="btn-action" @click="showModalGestio = true">⚙️ GESTIONAR CATÀLEG</button>
    </div>
</div>

<div class="main-container">
    <!-- WAREHOUSE / STOCK -->
    <div class="section section-magatzem">
        <h2>
            <span>📦 STOCK</span> 
            <button class="btn-action px-3 py-1 h-auto text-xs" @click="afegirFilaStock()">+ Entrada</button>
        </h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="110">Ubicació</th>
                        <th>Material</th>
                        <th width="80">Stock</th>
                        <th width="30"></th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="s in dades.stock" :key="s.id">
                        <tr class="row-box" :class="getCatClass(s.ref)">
                            <td>
                                <select :value="s.magatzem" @change="canviarMag(s.id, $event.target.value)">
                                    <template x-for="m in dades.magatzems" :key="m">
                                        <option :value="m" x-text="m" :selected="s.magatzem === m"></option>
                                    </template>
                                    <option value="ADD">+ Nou Magatzem...</option>
                                </select>
                            </td>
                            <td>
                                <select :value="s.ref" @change="canviarItemStock(s.id, $event.target.value)">
                                    <option value="">-- Selecciona Material --</option>
                                    <template x-for="c in dades.categories" :key="c">
                                        <optgroup :label="c">
                                            <template x-for="m in dades.cataleg.filter(x => x.cat === c)" :key="m.ref">
                                                <option :value="m.ref" x-text="m.ref + ' | ' + m.nom" :selected="s.ref === m.ref"></option>
                                            </template>
                                        </optgroup>
                                    </template>
                                </select>
                            </td>
                            <td>
                                <button class="btn-qty" @click="modQty(s.id, -1)">-</button>
                                <b x-text="s.stock"></b>
                                <button class="btn-qty" @click="modQty(s.id, 1)">+</button>
                            </td>
                            <td>
                                <button class="delete-btn" @click="borrarStock(s.id)">✖</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ORDERS / COMANDES -->
    <div class="section section-comandes">
        <h2>
            <span>🚚 COMANDES</span> 
            <button class="btn-action px-3 py-1 h-auto text-xs" @click="novaComanda()">✚ Nova</button>
        </h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="90">Data</th>
                        <th width="120">Centre</th>
                        <th>Material</th>
                        <th width="50">Uds.</th>
                        <th width="75">Estat</th>
                        <th width="95">Rec.</th>
                        <th width="30"></th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="(c, index) in dades.comandes" :key="index">
                        <tr class="row-box" :class="[getCatClass(c.ref), (!c.ref || c.uds > getEstocDisponible(c.ref)) && c.estat === 'pendent' ? 'no-stock-row' : '']" :style="c.estat === 'entregat' ? 'opacity:0.5;' : ''">
                            <td><input type="date" x-model="c.data" @change="guardar()"></td>
                            <td>
                                <select x-model="c.centre" @change="guardar()">
                                    <option value="">-- Selecciona --</option>
                                    <template x-for="p in centresLlista" :key="p">
                                        <option :value="p" x-text="p" :selected="c.centre === p"></option>
                                    </template>
                                </select>
                            </td>
                            <td>
                                <select x-model="c.ref" @change="guardar()">
                                    <option value="">-- Selecciona --</option>
                                    <template x-for="m in dades.cataleg" :key="m.ref">
                                        <option :value="m.ref" x-text="m.ref + ' - ' + m.nom" :selected="c.ref === m.ref"></option>
                                    </template>
                                </select>
                            </td>
                            <td><input type="number" min="1" x-model.number="c.uds" @change="guardar()" style="width: 100%;"></td>
                            <td>
                                <button class="status-btn text-[9px]" :class="c.estat === 'entregat' ? 'entregat' : 'pendent'" @click="canviarEstat(index)" x-text="c.estat === 'entregat' ? 'Entregat' : 'Pendent'"></button>
                            </td>
                            <td><input type="date" x-model="c.rec" @change="guardar()"></td>
                            <td><button class="delete-btn" @click="borrarCom(index)">✖</button></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL CATALOG -->
<div class="modal-overlay" x-show="showModalGestio" @click="showModalGestio = false" x-cloak></div>
<div id="modalGestio" x-show="showModalGestio" x-cloak>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3>⚙️ Catàleg de Materials</h3>
        <button @click="showModalGestio = false" class="delete-btn">✖</button>
    </div>
    
    <div style="background:#f9f9f9; padding:8px; border:1px solid #ddd; display:flex; gap:4px; margin-bottom:8px;">
        <input type="text" x-model="newRef" placeholder="Ref. 0000" style="width:70px;">
        <input type="text" x-model="newNom" placeholder="NOM MATERIAL" style="flex:1;">
        <select x-model="newCat" style="width:150px;" @change="comprovarNovaCat($event.target.value)">
            <template x-for="c in dades.categories" :key="c">
                <option :value="c" x-text="c" :selected="newCat === c"></option>
            </template>
            <option value="ADD_CAT">+ Nova temàtica...</option>
        </select>
        <button class="btn-action text-xs" @click="afegirAlCataleg()">Afegir</button>
    </div>
    
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="80">REF</th>
                    <th>NOM</th>
                    <th width="150">TEMÀTICA</th>
                    <th width="30"></th>
                </tr>
            </thead>
            <tbody>
                <template x-for="(m, i) in dades.cataleg" :key="i">
                    <tr class="row-box" :class="getCatClass(m.ref)">
                        <td><input type="text" x-model="m.ref" @change="guardar()"></td>
                        <td><input type="text" x-model="m.nom" @change="m.nom = m.nom.toUpperCase(); guardar()"></td>
                        <td>
                            <select x-model="m.cat" @change="guardar()">
                                <template x-for="c in dades.categories" :key="c">
                                    <option :value="c" x-text="c" :selected="m.cat === c"></option>
                                </template>
                            </select>
                        </td>
                        <td><button class="delete-btn" @click="eliminarDelCataleg(i)">✖</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>

<script src="./js/inventari.js"></script>
</body>
</html>
