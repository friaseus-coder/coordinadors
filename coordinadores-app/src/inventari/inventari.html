<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>INVENTARI - Logística</title>
    <script src="../js/persistence.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root { 
            --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
            --nyn-verd-accent: #008d36; /* Verde acento */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --color-consumibles: #3b82f6; 
            --color-ofimatica: #22c55e; 
            --color-manteniment: #eab308; 
            --color-mobiliari: #a855f7;
        }

        * { font-family: 'Outfit', sans-serif !important; }

        body { 
            background: #f8fafc; margin: 0; font-size: 11px; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        /* --- HEADER ESTILO CUADRANTE --- */
        header { 
            background-color: var(--nyn-verd) !important; 
            color: white !important; 
            padding: 8px 24px !important; 
            display: flex !important;        
            justify-content: center !important; 
            align-items: center !important; 
            height: 48px !important; 
            border-bottom: 2px solid var(--nyn-verd-accent) !important;
            box-sizing: border-box !important;
            margin-bottom: 0 !important;
            text-align: center !important;
            position: relative;
            z-index: 1000;
        }
        header h1 { 
            font-size: 15px !important; 
            font-weight: 700 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 1px !important; 
            color: white !important;
            margin: 0 !important;
        }

        /* --- BARRA DE HERRAMIENTAS Y CONTROL --- */
        .admin-panel { 
            padding: 10px 24px; 
            display: flex; 
            flex-wrap: wrap;
            gap: 12px; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            background: #ffffff; 
            margin-bottom: 12px;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: var(--shadow-sm);
        }
        .filter-label { 
            font-weight: 700; 
            color: var(--nyn-verd); 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        /* DROPDOWNS Y BOTONES */
        select, button, input[type="text"], input[type="number"] {
            padding: 4px 10px !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 6px !important;
            font-size: 11px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            height: 28px !important;
            box-sizing: border-box !important;
            transition: all 0.2s ease !important;
            background: #ffffff !important;
            color: #334155 !important;
            box-shadow: var(--shadow-sm) !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        input[type="text"], input[type="number"] {
            cursor: text !important;
        }
        select:hover, select:focus, input[type="text"]:focus {
            border-color: var(--nyn-verd-accent) !important;
            outline: none !important;
        }

        .btn-action {
            background: var(--nyn-verd) !important;
            color: #ffffff !important;
            border: 1px solid var(--nyn-verd) !important;
            font-weight: 600 !important;
        }
        .btn-action:hover {
            background: #0b4e43 !important;
            border-color: #0b4e43 !important;
        }
        .btn-action-sec {
            background: #3b82f6 !important;
            color: white !important;
            border: 1px solid #3b82f6 !important;
            font-weight: 600 !important;
        }
        .btn-action-sec:hover {
            background: #2563eb !important;
            border-color: #2563eb !important;
        }
        .btn-archive {
            background: #f1f5f9 !important;
            border: 1px solid #e2e8f0 !important;
            color: #475569 !important;
        }
        .btn-archive:hover {
            background: #e2e8f0 !important;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; padding: 16px 24px; gap: 16px; background: #f8fafc; }
        .section { background: white; border: 1px solid var(--border); display: flex; flex-direction: column; border-radius: 12px; box-shadow: var(--shadow-md); overflow: hidden; }
        .section-magatzem { width: 550px; } 
        .section-comandes { flex: 1; }
        
        h2 { 
            background: #f8fafc; margin: 0; padding: 12px 16px; font-size: 12px; font-weight: 700;
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; 
            color: var(--nyn-verd); text-transform: uppercase;
        }
        
        .table-wrapper { flex: 1; overflow-y: auto; padding: 8px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #1e293b; color: white; padding: 8px 4px; border: 1px solid #334155; font-size: 10px; font-weight: 600; text-transform: uppercase; position: sticky; top: 0; z-index: 10; }
        td { padding: 4px 6px; border-bottom: 1px solid #e2e8f0; text-align: center; height: 28px; }
        
        .row-box { border-left: 4px solid #ccc; }
        .row-consumibles { border-left-color: var(--color-consumibles); }
        .row-ofimatica { border-left-color: var(--color-ofimatica); }
        .row-manteniment { border-left-color: var(--color-manteniment); }
        .row-mobiliari { border-left-color: var(--color-mobiliari); }
        .no-stock-row { background-color: #fef2f2 !important; border-right: 4px solid #ef4444; }
        
        input, select { font-size: 11px; padding: 2px 4px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; height: 24px; box-sizing: border-box; }
        .btn-qty { width: 22px; height: 22px; cursor: pointer; border: 1px solid #cbd5e1; background: white; font-weight: bold; line-height: 1; border-radius: 4px; }
        .btn-qty:hover { border-color: var(--nyn-verd-accent); color: var(--nyn-verd-accent); }
        
        .status-btn { padding: 0 4px; border-radius: 6px; font-weight: bold; font-size: 9px; width: 100%; cursor: pointer; height: 22px; border: 1px solid transparent; }
        .pendent { background: #fffbeb; color: #d97706; border-color: #fef3c7; }
        .entregat { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
        .delete-btn { cursor: pointer; color: #cbd5e1; font-size: 14px; background: none; border: none; font-weight: bold; transition: color 0.2s; }
        .delete-btn:hover { color: #ef4444; }
        
        #modalGestio { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; z-index:2000; box-shadow: var(--shadow-md); width:700px; max-height: 90vh; border-radius: 12px; border: 2px solid var(--nyn-verd); flex-direction: column; }
        #modalGestio h3 { color: var(--nyn-verd); margin: 0; font-weight: 700; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1999; }
    </style>
    <script src="../js/i18n.js"></script>
    <script>
       // Forzar traducción inmediata al cargar
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
</head>
<body data-required-roles="coordinador,jefe_operaciones">

<header>
    <h1>Inventari i Logística</h1>
</header>

<div class="admin-panel">
    <div class="toolbar-group">
        <span class="filter-label">Dades:</span>
        <button class="btn-archive" onclick="document.getElementById('importFile').click()">📂 Importar</button>
        <button class="btn-archive" onclick="exportarJSON()">💾 Exportar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarJSON(event)">
    </div>
    
    <div class="toolbar-group">
        <button class="btn-action" onclick="obrirGestio()">⚙️ GESTIONAR CATÀLEG</button>
    </div>
</div>

<div class="main-container">
    <div class="section section-magatzem">
        <h2>📦 STOCK <button class="btn-nyn btn-add" onclick="afegirFilaStock()">+ Entrada</button></h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th width="90">Ubicació</th><th>Material</th><th width="70">Stock</th><th width="25"></th></tr></thead>
                <tbody id="bodyMagatzem"></tbody>
            </table>
        </div>
    </div>
    <div class="section section-comandes">
        <h2>🚚 COMANDES <button class="btn-nyn btn-add" onclick="novaComanda()">✚ Nova</button></h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th width="75">Data</th><th width="120">Centre</th><th>Material</th><th width="35">Uds.</th><th width="65">Estat</th><th width="75">Rec.</th><th width="25"></th></tr></thead>
                <tbody id="bodyComandes"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="overlay" onclick="tancarGestio()"></div>
<div id="modalGestio">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><h3>⚙️ Catàleg</h3><button onclick="tancarGestio()" class="delete-btn">✖</button></div>
    <div style="background:#f9f9f9; padding:8px; border:1px solid #ddd; display:flex; gap:4px; margin-bottom:8px;">
        <input type="text" id="newRef" placeholder="Ref. 0000" style="width:70px;">
        <input type="text" id="newNom" placeholder="NOM MATERIAL" style="flex:1;">
        <select id="newCat" style="width:150px;" onchange="comprovarNovaCat(this)">
            <option value="CONSUMIBLES IMPRESSORA">CONSUMIBLES</option>
            <option value="MATERIAL OFIMÀTIC">OFIMÀTICA</option>
            <option value="MANTENIMENT I VARIS">MANTENIMENT</option>
            <option value="MOBILIARI I ERGONOMIA">MOBILIARI</option>
            <option value="ADD_CAT">+ Nova temàtica...</option>
        </select>
        <button class="btn-nyn btn-add" style="background:var(--nn-green); color:white;" onclick="afegirAlCataleg()">Afegir</button>
    </div>
    <div class="table-wrapper"><table><thead><tr><th width="80">REF</th><th>NOM</th><th width="150">TEMÀTICA</th><th width="30"></th></tr></thead><tbody id="bodyGestio"></tbody></table></div>
</div>

<script>
    const centresLlista = ["NN ARAGÓ", "NN BONANOVA", "NN BORRELL", "NN BRUC", "NN CONCEPT", "NN CORSEGA", "NN DIAGONAL", "NN EL PALLOL", "NN ESPRONCEDA", "NN ESTEVE TARRADAS", "NN GEIGLE", "NN GRAN VIA", "NN HERCEGOVINA", "NN MASTER CATALONIA", "NN LA ROTONDA", "NN PEDRALBES", "NN ROCAFORT", "NN SANTALÓ", "NN SANT GERVASI", "NN SENTMENAT 2", "NN TAMARITA", "NN TARRAGONA", "NN TRAVESSERA", "NN URGELL", "NN URGELL 2", "NN VALENCIA", "NN VALENCIA 2", "NN VALENCIA 3", "NN VIA AUGUSTA", "ZONA FRANCA", "OFICINA CENTRAL"].sort();
    
    let dades = { 
        cataleg: [], 
        stock: [], 
        comandes: [], 
        magatzems: ["OFICINES", "PROVENÇA", "CÒRSEGA"],
        categories: ["CONSUMIBLES IMPRESSORA", "MATERIAL OFIMÀTIC", "MANTENIMENT I VARIS", "MOBILIARI I ERGONOMIA"]
    };

    async function guardar() {
        if (persistence.isReadOnly()) return;
        await persistence.write(dades);
    }
    async function carregar() {
        const canEdit = await persistence.init('inventari');
        const fileData = await persistence.read();
        if (fileData) {
            dades = fileData;
        } else {
            const d = localStorage.getItem('nyn_log_v13');
            if (d) {
                dades = JSON.parse(d);
                if (canEdit) await persistence.write(dades);
            }
        }
        render();
    }

    function getCatClass(ref) {
        const m = dades.cataleg.find(x=>x.ref===ref);
        if(!m) return "";
        const c = m.cat;
        if(c.includes("CONSUM")) return "row-consumibles";
        if(c.includes("OFIM")) return "row-ofimatica";
        if(c.includes("MANTEN")) return "row-manteniment";
        if(c.includes("MOBILI")) return "row-mobiliari";
        return "";
    }

    function render() {
        const refsEnStock = dades.stock.map(s => s.ref);
        
        // Render Stock
        document.getElementById('bodyMagatzem').innerHTML = dades.stock.map(s => {
            let opts = `<option value="">-- Tria --</option>`;
            dades.categories.forEach(c => {
                const items = dades.cataleg.filter(m => m.cat === c && (!refsEnStock.includes(m.ref) || m.ref === s.ref));
                if(items.length) {
                    opts += `<optgroup label="${c}">` + items.map(i=>`<option value="${i.ref}" ${s.ref===i.ref?'selected':''}>${i.ref} | ${i.nom}</option>`).join('') + `</optgroup>`;
                }
            });
            return `<tr class="row-box ${getCatClass(s.ref)}">
                <td><select onchange="canviarMag(${s.id}, this)"><option value="ADD">+ Nou</option>${dades.magatzems.map(m=>`<option value="${m}" ${s.magatzem===m?'selected':''}>${m}</option>`).join('')}</select></td>
                <td><select onchange="canviarItemStock(${s.id}, this.value)">${opts}</select></td>
                <td><button class="btn-qty" onclick="modQty(${s.id},-1)">-</button> <b>${s.stock}</b> <button class="btn-qty" onclick="modQty(${s.id},1)">+</button></td>
                <td><button class="delete-btn" onclick="borrarStock(${s.id})">✖</button></td></tr>`;
        }).join('');

        // Render Comandes (Ordenades per Centre)
        const comandesOrdenades = [...dades.comandes].sort((a, b) => a.centre.localeCompare(b.centre));
        
        document.getElementById('bodyComandes').innerHTML = comandesOrdenades.map((c) => {
            const idxOriginal = dades.comandes.indexOf(c);
            const isE = c.estat==='entregat';
            const s = dades.stock.find(x => x.ref === c.ref);
            const estocDisponible = s ? s.stock : 0;
            const faltaEstoc = !isE && c.ref && c.uds > estocDisponible;
            
            return `<tr class="row-box ${getCatClass(c.ref)} ${faltaEstoc ? 'no-stock-row' : ''}" style="${isE?'opacity:0.5':''}">
                <td><input type="date" value="${c.data}" onchange="dades.comandes[${idxOriginal}].data=this.value; guardar()"></td>
                <td><select onchange="dades.comandes[${idxOriginal}].centre=this.value; render(); guardar()"><option value="">Tria Centre...</option>${centresLlista.map(p=>`<option value="${p}" ${c.centre===p?'selected':''}>${p}</option>`).join('')}</select></td>
                <td><select onchange="dades.comandes[${idxOriginal}].ref=this.value; render(); guardar()"><option value="">Tria Material...</option>${dades.cataleg.map(m=>`<option value="${m.ref}" ${c.ref===m.ref?'selected':''}>${m.ref} - ${m.nom}</option>`).join('')}</select></td>
                <td><input type="number" min="1" value="${c.uds}" onchange="dades.comandes[${idxOriginal}].uds=Math.max(1,parseInt(this.value)); render(); guardar()"></td>
                <td><button class="status-btn ${isE?'entregat':'pendent'}" onclick="canviarEstat(${idxOriginal})">${isE?'ENTREGAT':'PENDENT'}</button></td>
                <td><input type="date" value="${c.rec||''}" onchange="dades.comandes[${idxOriginal}].rec=this.value; guardar()"></td>
                <td><button class="delete-btn" onclick="borrarCom(${idxOriginal})">✖</button></td></tr>`;
        }).join('');
    }

    function canviarEstat(i) {
        const c = dades.comandes[i], s = dades.stock.find(x=>x.ref===c.ref);
        if(!c.ref || !c.centre) return alert("Falta centre o material!");
        if(c.estat==='pendent') {
            if(!s || s.stock < c.uds) return alert("ATENCIÓ: No hi ha prou estoc.");
            s.stock -= c.uds; c.estat='entregat'; c.rec=new Date().toISOString().split('T')[0];
        } else { if(s) s.stock += c.uds; c.estat='pendent'; }
        render(); guardar();
    }

    function modQty(id, d) { 
        const i = dades.stock.find(x=>x.id===id); 
        i.stock=Math.max(0, i.stock+d); render(); guardar(); 
    }

    function canviarItemStock(id, val) {
        if(val && dades.stock.find(x => x.ref === val && x.id !== id)) return alert("Ítem ja en stock!");
        dades.stock.find(x => x.id === id).ref = val; render(); guardar();
    }

    function comprovarNovaCat(el) {
        if(el.value === "ADD_CAT") {
            const n = prompt("Nova temàtica:").toUpperCase();
            if(n && !dades.categories.includes(n)) { dades.categories.push(n); actualitzarSelectorsCat(); el.value = n; }
            else { el.value = dades.categories[0]; }
        }
    }

    function actualitzarSelectorsCat() {
        const sel = document.getElementById('newCat');
        const curr = sel.value;
        sel.innerHTML = dades.categories.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="ADD_CAT">+ Nova temàtica...</option>`;
        sel.value = curr;
    }

    function afegirFilaStock() { dades.stock.unshift({id:Date.now(), magatzem:dades.magatzems[0], ref:"", stock:0}); render(); }
    function novaComanda() { dades.comandes.unshift({data:new Date().toISOString().split('T')[0], centre:"", ref:"", uds:1, estat:'pendent'}); render(); }
    
    function canviarMag(id, el) {
        if(el.value==="ADD") {
            const n = prompt("Nom magatzem:").toUpperCase();
            if(n) { dades.magatzems.push(n); dades.stock.find(x=>x.id===id).magatzem=n; guardar(); render(); }
        } else { dades.stock.find(x=>x.id===id).magatzem=el.value; guardar(); }
    }

    function obrirGestio() { actualitzarSelectorsCat(); document.getElementById('modalGestio').style.display='flex'; document.getElementById('overlay').style.display='block'; renderGestio(); }
    function tancarGestio() { document.getElementById('modalGestio').style.display='none'; document.getElementById('overlay').style.display='none'; render(); }
    
    function renderGestio() {
        document.getElementById('bodyGestio').innerHTML = dades.cataleg.sort((a,b)=>a.ref.localeCompare(b.ref)).map((m) => {
            const i = dades.cataleg.indexOf(m);
            return `<tr class="row-box ${getCatClass(m.ref)}">
                <td><input type="text" value="${m.ref}" onchange="dades.cataleg[${i}].ref=this.value; guardar()"></td>
                <td><input type="text" value="${m.nom}" onchange="dades.cataleg[${i}].nom=this.value.toUpperCase(); guardar()"></td>
                <td><select onchange="dades.cataleg[${i}].cat=this.value; renderGestio(); guardar()">${dades.categories.map(c=>`<option value="${c}" ${m.cat===c?'selected':''}>${c}</option>`).join('')}</select></td>
                <td><button class="delete-btn" onclick="dades.cataleg.splice(${i},1); renderGestio(); guardar()">✖</button></td></tr>`;
        }).join('');
    }

    function afegirAlCataleg() {
        const r = document.getElementById('newRef').value, n = document.getElementById('newNom').value, c = document.getElementById('newCat').value;
        if(r && n) { dades.cataleg.push({cat:c, ref:r, nom:n.toUpperCase()}); renderGestio(); guardar(); }
    }
    function borrarStock(id) { dades.stock = dades.stock.filter(x=>x.id!==id); render(); guardar(); }
    function borrarCom(i) { dades.comandes.splice(i,1); render(); guardar(); }
    function exportarJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(dades)], {type:"application/json"})); a.download="inventari.json"; a.click(); }
    function importarJSON(e) { 
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); r.onload= async (ev)=>{ dades=JSON.parse(ev.target.result); render(); await guardar(); }; r.readAsText(f);
    }
    window.onload = carregar;
</script>
</body>
</html>
