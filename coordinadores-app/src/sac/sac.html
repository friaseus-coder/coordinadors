<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>SAC - incidències pàrkings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <style>
        :root {
            --verd-corporatiu: #004d00;
            --verd-clar: #e6f2e6;
            --fons: #ffffff;
            --text-primari: #333333;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        .contenedor-app {
            background-color: var(--fons);
            width: 100%;
            max-width: 650px; 
            border: 2px solid var(--verd-corporatiu);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            max-height: 98vh; 
        }

        .capçalera-app {
            background-color: var(--verd-corporatiu);
            color: white;
            padding: 10px 15px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .capçalera-titol {
            margin: 0;
            text-transform: uppercase;
            font-size: 16px;
            font-weight: bold;
        }

        .capçalera-logo {
            height: 33px; 
        }

        .formulari-app {
            padding: 10px 15px;
            overflow-y: auto; 
            flex-grow: 1;
        }

        label { 
            display: block; 
            margin-top: 8px; 
            font-weight: bold; 
            color: var(--verd-corporatiu);
            font-size: 14px;
        }

        input, textarea, select { 
            width: 100%; 
            padding: 8px; 
            margin-top: 4px; 
            box-sizing: border-box; 
            border: 1px solid var(--verd-corporatiu); 
            border-radius: 4px; 
            font-size: 14px;
            color: var(--text-primari);
        }

        textarea { 
            height: 110px; 
            resize: vertical;
        }

        .opcionals { 
            background: var(--verd-clar); 
            padding: 10px 15px; 
            margin-top: 15px; 
            border-radius: 8px; 
            border: 1px dashed var(--verd-corporatiu); 
        }

        .titol-opcionals {
            color: var(--verd-corporatiu);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-item { 
            display: flex; 
            align-items: center; 
        }

        .checkbox-item input { 
            width: auto; 
            margin: 0 6px 0 0; 
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            font-size: 13px;
        }

        .peu-app {
            padding: 10px 15px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--verd-corporatiu); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }

        button:hover { 
            background-color: #003300; 
        }

        .llegenda-beta {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
    <script src="../js/i18n.js"></script>
</head>

    <script>
        function generarCorreu() {
            const form = document.getElementById('formComunicacio');
            if (!form.checkValidity()) {
                alert("Si us plau, omple tots els camps obligatoris.");
                return;
            }

            const centreFull = document.getElementById('ubicacio').value;
            const zona = document.getElementById('zona_especifica').value;
            const resum = document.getElementById('assumpte_breu').value;
            const motiu = document.getElementById('motiu').value;
            const urgencia = document.getElementById('urgencia').value;

            const ara = new Date();
            const data = ara.toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const hora = ara.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' }) + "h";

            const parts = centreFull.split(' - ');
            const adreçaYSocietat = parts[parts.length - 1];

            const to = "SAC@grupnn.com";
            let cc = "marroyo@nnparkings.com"; 
            
            if (document.getElementById('albert').checked) cc += "; acampins@nnparkings.com";
            if (document.getElementById('laura').checked) cc += "; lnavarrog@nnparkings.com";
            if (document.getElementById('aleix').checked) cc += "; aprat@nnparkings.com";

            const subject = `nº ${centreFull} - ${resum}`;
            
            // Capçalera en minúscules per semblar font més petita amb || i espais extra
            let header = "*** gestor d'incidències pàrkings - sac  ||  " + data + " - " + hora + " ***\n\n\n";

            let body = header + "Bon dia,\n\n";
            body += "UBICACIÓ: " + adreçaYSocietat + " - " + zona + "\n";
            body += "MOTIU:    " + motiu + "\n";
            body += "URGÈNCIA: " + (urgencia === "CRÍTICA" ? "!!! CRÍTICA !!!" : urgencia) + "\n\n";
            body += "Gràcies.";

            window.location.href = `mailto:${to}?cc=${cc}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }
    </script>

<script>
// --- VIGILANT PER AL SAC (INCIDÈNCIES) ---

// 1. Funció de Log (imprescindible en cada fitxer)
function registrarLog(usuari, accio) {
    const ara = new Date();
    const dataFormatada = ara.toLocaleString('ca-ES', { 
        day: '2-digit', month: '2-digit', year: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
    });
    const nouLog = {
        data: dataFormatada,
        usuari: usuari.toUpperCase(),
        fitxer: "sac.html",
        accio: accio.trim()
    };
    let logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
    logs.unshift(nouLog);
    if (logs.length > 500) logs.pop();
    localStorage.setItem('nyn_logs', JSON.stringify(logs));
}

// 2. Modificació de la funció original per incloure el registre
// Busquem la teva funció generarCorreu() i hi afegim el log al final
const funcioOriginalGenerarCorreu = generarCorreu;

generarCorreu = function() {
    // Primer executem la lògica de validació original
    const form = document.getElementById('formComunicacio');
    if (form.checkValidity()) {
        const centre = document.getElementById('ubicacio').value.split(' - ')[0]; // Agafem només el número
        const resum = document.getElementById('assumpte_breu').value;
        const urgencia = document.getElementById('urgencia').value.toUpperCase();

        // Enregistrem l'acció abans d'obrir el mailto
        registrarLog("SISTEMA", `SAC: Generada incidència centre ${centre} [Urgència: ${urgencia}] -> ${resum}`);
    }
    
    // Cridem a la funció original perquè obri el correu
    funcioOriginalGenerarCorreu();
};

// 3. Registre de visualització
window.addEventListener('load', function() {
    registrarLog("SISTEMA", "SAC: Obert formulari d'incidències");
});
</script>
