<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>SAC - incidències pàrkings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
            --nyn-verd-accent: #008d36; /* Verde acento */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --text-primari: #1e293b;
        }
        
        * { font-family: 'Outfit', 'Segoe UI', Tahoma, sans-serif !important; }

        body { 
            margin: 0;
            padding: 24px;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        .contenedor-app {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px; 
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            max-height: 98vh; 
            overflow: hidden;
        }

        .capçalera-app {
            background-color: var(--nyn-verd) !important;
            color: white !important;
            padding: 12px 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            border-bottom: 2px solid var(--nyn-verd-accent) !important;
            box-sizing: border-box !important;
        }

        .capçalera-titol {
            margin: 0;
            text-transform: uppercase;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .capçalera-logo {
            height: 28px; 
            object-fit: contain;
        }

        .formulari-app {
            padding: 20px 24px;
            overflow-y: auto; 
            flex-grow: 1;
        }

        label { 
            display: block; 
            margin-top: 12px; 
            font-weight: 700; 
            color: var(--nyn-verd);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select { 
            width: 100%; 
            padding: 8px 12px; 
            margin-top: 6px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 13px;
            color: var(--text-primari);
            background: #ffffff;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--nyn-verd-accent);
            outline: none;
        }

        textarea { 
            height: 110px; 
            resize: vertical;
        }

        .opcionals { 
            background: #f8fafc; 
            padding: 16px; 
            margin-top: 16px; 
            border-radius: 8px; 
            border: 1px dashed #cbd5e1; 
        }

        .titol-opcionals {
            color: var(--nyn-verd);
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-item { 
            display: flex; 
            align-items: center; 
        }

        .checkbox-item input { 
            width: auto; 
            margin: 0 6px 0 0; 
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            font-size: 13px;
            color: var(--text-primari);
        }

        .peu-app {
            padding: 16px 24px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
        }

        button { 
            width: 100%; 
            padding: 10px 16px; 
            background-color: var(--nyn-verd) !important; 
            color: white !important; 
            border: none !important; 
            border-radius: 6px !important; 
            cursor: pointer !important; 
            font-size: 13px !important; 
            font-weight: 700 !important;
            text-transform: uppercase;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        button:hover { 
            background-color: #0b4e43 !important; 
        }

        .llegenda-beta {
            font-size: 10px;
            color: #64748b;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
    <script src="../js/i18n.js"></script>
    <script>
        // Forzar traducción inmediata al cargar
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof applyTranslations === 'function') applyTranslations();
        });
    </script>
</head>
<body data-required-roles="coordinador,jefe_operaciones">

    <div class="contenedor-app">
        <header class="capçalera-app">
            <h2 class="capçalera-titol" data-i18n="sacTitle">Gestor d'incidències pàrkings (SAC)</h2>
            <img src="descarga.png" alt="Grup Núñez i Navarro" class="capçalera-logo">
        </header>

        <form class="formulari-app" id="formComunicacio">
            <label for="ubicacio" data-i18n="lblSacCentre">Selecciona el centre:</label>
            <select id="ubicacio" required>
                <option value="" disabled selected data-i18n="optSacSelectCentre">-- Escull el centre --</option>
            </select>

            <label for="zona_especifica" data-i18n="lblSacZona">Zona específica de la incidència:</label>
            <input type="text" id="zona_especifica" placeholder="Ex: Planta -2, rampa d'entrada, plaça 22..." data-i18n="placeholderSacZona" required>

            <label for="assumpte_breu" data-i18n="lblSacAssumpte">Resum breu (per l'assumpte):</label>
            <input type="text" id="assumpte_breu" placeholder="Ex: Enllumenat fos, Mirall trencat" data-i18n="placeholderSacAssumpte" required>

            <label for="motiu" data-i18n="lblSacMotiu">Motiu detallat:</label>
            <textarea id="motiu" placeholder="Descriviu aquí els detalls..." data-i18n="placeholderSacMotiu" required></textarea>

            <label for="urgencia" data-i18n="lblSacUrgencia">Nivell d'urgència:</label>
            <select id="urgencia">
                <option value="baixa" data-i18n="optUrgenciaBaixa">baixa</option>
                <option value="mitjana" selected data-i18n="optUrgenciaMitjana">mitjana</option>
                <option value="alta" data-i18n="optUrgenciaAlta">alta</option>
                <option value="urgent" data-i18n="optUrgenciaUrgent">urgent</option>
                <option value="CRÍTICA" data-i18n="optUrgenciaCritica">CRÍTICA</option>
            </select>

            <div class="opcionals">
                <strong class="titol-opcionals" data-i18n="lblSacCopia">Còpia opcional a:</strong>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="albert"> <label for="albert">Albert Campins</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="laura"> <label for="laura">Laura Navarro</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="aleix"> <label for="aleix">Aleix Prat</label>
                    </div>
                </div>
            </div>
        </form>

        <footer class="peu-app">
            <button type="button" onclick="generarCorreu()" data-i18n="btnSacGenerar">GENERAR CORREU</button>
            <div class="llegenda-beta">NN pàrkings 2026 v1.0 beta</div>
        </footer>
    </div>

    <script>
        async function cargarAparcamientos() {
            try {
                const select = document.getElementById('ubicacio');
                const query = `
                    SELECT a.numero_obra, a.nombre, a.zona, s.nombre_fiscal
                    FROM aparcamientos a
                    LEFT JOIN sociedades s ON a.sociedad_id = s.id
                    WHERE a.activo = 1
                    ORDER BY a.nombre ASC
                `;
                const parkings = await window.dbAPI.read('catalogos', query, []);
                
                // Conservar la opción inicial y vaciar el resto
                const defaultOption = select.options[0];
                select.innerHTML = '';
                if (defaultOption) {
                    select.appendChild(defaultOption);
                }
                
                parkings.forEach(p => {
                    const partes = [];
                    if (p.numero_obra) partes.push(p.numero_obra);
                    if (p.nombre) partes.push(p.nombre);
                    if (p.zona) partes.push(p.zona);
                    let texto = partes.join(' - ');
                    if (p.nombre_fiscal) {
                        texto += \` (\${p.nombre_fiscal})\`;
                    }
                    
                    const opt = document.createElement('option');
                    opt.value = texto;
                    opt.textContent = texto;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error al cargar los aparcamientos desde la base de datos:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarAparcamientos();
        });

        function generarCorreu() {
            const form = document.getElementById('formComunicacio');
            if (!form.checkValidity()) {
                alert(i18n.t('sacAlertFields'));
                return;
            }

            const ara = new Date();
            const centreFull = document.getElementById('ubicacio').value;
            const zona = document.getElementById('zona_especifica').value;
            const resum = document.getElementById('assumpte_breu').value;
            const motiu = document.getElementById('motiu').value;
            const urgencia = document.getElementById('urgencia').value;

            const locale = (typeof i18n !== 'undefined' && i18n.getLanguage() === 'es') ? 'es-ES' : 'ca-ES';
            const data = ara.toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: 'numeric' });
            const hora = ara.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }) + "h";

            const parts = centreFull.split(' - ');
            const adreçaYSocietat = parts[parts.length - 1];

            const to = "SAC@grupnn.com";
            let cc = "marroyo@nnparkings.com"; 
            
            if (document.getElementById('albert').checked) cc += "; acampins@nnparkings.com";
            if (document.getElementById('laura').checked) cc += "; lnavarrog@nnparkings.com";
            if (document.getElementById('aleix').checked) cc += "; aprat@nnparkings.com";

            const subject = `nº ${centreFull} - ${resum}`;
            
            // Capçalera en minúscules per semblar font més petita amb || i espais extra
            const isCa = i18n.getLanguage() === 'ca';
            const headerText = isCa 
                ? "*** gestor d'incidències pàrkings - sac  ||  " 
                : "*** gestor de incidencias parkings - sac  ||  ";
            let header = headerText + data + " - " + hora + " ***\n\n\n";

            let urgenciaTraduida = urgencia;
            if (urgencia === "CRÍTICA") {
                urgenciaTraduida = "!!! CRÍTICA !!!";
            } else {
                const key = "optUrgencia" + (urgencia === "mitjana" ? "Mitjana" : (urgencia === "baixa" ? "Baixa" : (urgencia === "alta" ? "Alta" : "Urgent")));
                urgenciaTraduida = i18n.t(key);
            }

            let body = header + i18n.t("sacEmailGreeting");
            body += i18n.t("sacEmailLocation") + adreçaYSocietat + " - " + zona + "\n";
            body += i18n.t("sacEmailReason") + motiu + "\n";
            body += i18n.t("sacEmailUrgency") + urgenciaTraduida + "\n\n";
            body += i18n.t("sacEmailThanks");

            window.location.href = `mailto:${to}?cc=${cc}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }
    </script>

<script>
// --- VIGILANT PER AL SAC (INCIDÈNCIES) ---

// 1. Funció de Log (imprescindible en cada fitxer)
function registrarLog(usuari, accio) {
    const ara = new Date();
    const locale = (typeof i18n !== 'undefined' && i18n.getLanguage() === 'es') ? 'es-ES' : 'ca-ES';
    const dataFormatada = ara.toLocaleString(locale, { 
        day: '2-digit', month: '2-digit', year: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
    });
    const nouLog = {
        data: dataFormatada,
        usuari: usuari.toUpperCase(),
        fitxer: "sac.html",
        accio: accio.trim()
    };
    let logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
    logs.unshift(nouLog);
    if (logs.length > 500) logs.pop();
    localStorage.setItem('nyn_logs', JSON.stringify(logs));
}

// 2. Modificació de la funció original per incloure el registre
// Busquem la teva funció generarCorreu() i hi afegim el log al final
const funcioOriginalGenerarCorreu = generarCorreu;

generarCorreu = function() {
    // Primer executem la lògica de validació original
    const form = document.getElementById('formComunicacio');
    if (form.checkValidity()) {
        const centre = document.getElementById('ubicacio').value.split(' - ')[0]; // Agafem només el número
        const resum = document.getElementById('assumpte_breu').value;
        const urgencia = document.getElementById('urgencia').value.toUpperCase();

        // Enregistrem l'acció abans d'obrir el mailto
        const isCa = i18n.getLanguage() === 'ca';
        const logAccio = isCa 
            ? `SAC: Generada incidència centre ${centre} [Urgència: ${urgencia}] -> ${resum}`
            : `SAC: Generada incidencia centro ${centre} [Urgencia: ${urgencia}] -> ${resum}`;
        registrarLog("SISTEMA", logAccio);
    }
    
    // Cridem a la funció original perquè obri el correu
    funcioOriginalGenerarCorreu();
};

// 3. Registre de visualització
window.addEventListener('load', function() {
    registrarLog("SISTEMA", i18n.t('sacAlertObert'));
});

// 4. Traducció de continguts en calent en rebre canvis de llengua
window.addEventListener('languageChanged', () => {
    i18n.translatePage();
});
</script>

</body>
</html>
