<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Control Treballadors</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       // Forzar traducción inmediata al cargar
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --nyn-verd-light: #e6f4ea;
        --nyn-festiu: #ffe4e6;     /* Rosa/rojo pastel */
        --nyn-substitucio-bg: #fef9c3; /* Amarillo pastel */
        --nyn-substitucio-border: #facc15;
        --nyn-substitucio-text: #b45309;
        --border: #e2e8f0;         /* Gris suave para bordes */
        --text-main: #0f2d4a;      /* Azul oscuro para títulos */
        --text-muted: #64748b;     /* Gris para subtítulos/labels */
        --bg-weekend: #f1f5f9;     /* Gris suave para findes */
        --bg-weekend-header: #f1f5f9;
        --bg-vacances: rgba(186, 104, 200, 0.18); /* Lila suave */
        --danger-coral: #ef4444;   /* Rojo coral premium */
        --danger-bg: #fef2f2;
        --danger-border: #fee2e2;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --nyn-marcador-tel: rgba(255, 235, 59, 0.25); 
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        font-size: 11px; 
        margin: 0; 
        background: #f8fafc; 
        color: #1e293b;
        overflow: visible;
    }
    
    .sticky-top { 
        position: sticky; 
        top: 0; 
        z-index: 1100; 
        background: white; 
        display: flex; 
        flex-direction: column; 
        box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
    }

    .llegenda-vacances { 
        font-size: 10px; 
        font-weight: 600; 
        color: #7b1fa2; 
        padding: 3px 8px; 
        border: 1px solid #7b1fa2; 
        border-radius: 9999px; 
        margin-left: 12px; 
        background: #f3e8ff;
    }

    .header-center { 
        font-size: 16px; 
        font-weight: 700; 
        text-transform: uppercase; 
        text-align: center; 
        letter-spacing: 1px; 
        display: flex;       
        align-items: center;
        gap: 12px;           
    }

    .admin-panel { 
        padding: 10px 24px; 
        display: flex; 
        flex-wrap: wrap;
        gap: 12px; 
        align-items: center; 
        border-bottom: 1px solid var(--border); 
        background: #ffffff; 
    }
    
    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f8fafc;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #f1f5f9;
    }

    .toolbar-group.danger-group {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        margin-left: auto;
    }

    .filter-label { 
        font-weight: 700; 
        color: var(--nyn-verd); 
        font-size: 10px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }

    select, button { 
        padding: 4px 10px; 
        border: 1px solid #cbd5e1; 
        border-radius: 6px; 
        font-size: 11px; 
        font-weight: 500;
        cursor: pointer; 
        height: 28px; 
        box-sizing: border-box; 
        font-family: inherit; 
        transition: all 0.2s ease;
        background: #ffffff;
        color: #334155;
        box-shadow: var(--shadow-sm);
    }
    
    select:hover, select:focus {
        border-color: var(--nyn-verd-accent);
        outline: none;
    }

    .btn-main { 
        background: #ffffff; 
        color: #334155; 
        font-weight: 600; 
        border: 1px solid #cbd5e1; 
    }
    
    .btn-main:hover {
        background: #f1f5f9;
        border-color: #94a3b8;
    }

    .btn-action {
        background: var(--nyn-verd);
        color: #ffffff;
        border: 1px solid var(--nyn-verd);
        font-weight: 600;
    }

    .btn-action:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-action-sec {
        background: #3b82f6;
        color: white;
        border: 1px solid #3b82f6;
        font-weight: 600;
    }

    .btn-action-sec:hover {
        background: #2563eb;
        border-color: #2563eb;
    }

    .btn-archive {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        color: #475569;
    }

    .btn-archive:hover {
        background: #e2e8f0;
    }

    .btn-danger-right { 
        background: var(--danger-coral); 
        color: white; 
        font-weight: 600; 
        border: 1px solid var(--danger-coral); 
    }

    .btn-danger-right:hover {
        background: #dc2626;
        border-color: #dc2626;
    }

    .table-wrapper {
        padding: 16px 24px;
        background: #f8fafc;
    }

    #mainTable {
        table-layout: fixed !important;
        width: 100% !important; 
        min-width: 1200px;      
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
    }

    thead th { 
        background: #1e293b !important; 
        color: #ffffff !important; 
        height: 36px; 
        font-size: 11px; 
        font-weight: 600;
        position: -webkit-sticky; 
        position: sticky; 
        top: 110px; 
        z-index: 999; 
        border: none;
        border-bottom: 2px solid #0f172a;
        border-right: 1px solid #334155;
        vertical-align: middle;
    }

    thead th:last-child {
        border-right: none;
    }

    thead th.is-weekend-header { color: #fef08a !important; }
    thead th.is-festiu-header { color: #fca5a5 !important; } 

    th, td { 
        border-right: 1px solid var(--border); 
        border-bottom: 1px solid var(--border); 
        text-align: center; 
        padding: 0; 
        position: relative; 
    }
    
    tr:last-child td {
        border-bottom: none;
    }

    td:last-child {
        border-right: none;
    }

    tbody tr:hover {
        background-color: #f8fafc;
    }

    .selected-cell {
        background-color: rgba(0, 141, 54, 0.08) !important;
        z-index: 10 !important;
        position: relative;
    }

    .selected-cell .cell-container {
        outline: 2px solid var(--nyn-verd-accent) !important;
        outline-offset: -2px;
        border-radius: 4px;
        z-index: 10;
    }

    .col-name { 
        background-color: #f8fafc; 
        font-weight: bold; 
        color: var(--text-main); 
        font-size: 10px;
        text-transform: uppercase; 
        letter-spacing: 0.5px;
        text-align: left;
        padding-left: 12px;
        box-sizing: border-box;
        border-right: 2px solid var(--border);
        width: 105px !important;
        min-width: 105px !important;
    }

    .is-weekend { background-color: var(--bg-weekend) !important; }
    .is-festiu { background-color: var(--nyn-festiu) !important; }
    .is-vacances { background-color: var(--bg-vacances) !important; }

    .has-note::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 6px 6px 0;
        border-color: transparent #ef4444 transparent transparent;
        z-index: 5;
    }

    .cell-container { 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: stretch;
        padding: 3px; 
        gap: 2px; 
        height: 52px; 
        box-sizing: border-box;
        width: 100%;
    }

    .select-worker, .select-hour { 
        width: 100%; 
        border: 1px solid #cbd5e1; 
        border-radius: 4px; 
        font-size: 8px; 
        padding: 1px; 
        height: 18px !important;
        background: white; 
        color: #334155; 
        font-weight: 500;
        box-shadow: none;
        outline: none;
    }
    
    .select-worker { font-weight: 700; color: var(--nyn-verd); }
    .select-hour { font-size: 8px; color: #475569; font-weight: bold; }

    .sub-radio { 
        align-self: center; 
        margin: 0; 
        width: 12px; 
        height: 12px; 
        cursor: pointer;
        accent-color: var(--nyn-verd-accent);
    }

    .center-header { 
        background: #f1f5f9; 
        padding: 6px 12px; 
        display: flex; 
        align-items: center; 
        gap: 8px;
        border-bottom: 2px solid #cbd5e1;
        border-top: 1px solid var(--border);
    }
    .check-marcador { 
        width: 13px; 
        height: 13px; 
        cursor: pointer;
        accent-color: var(--nyn-verd-accent);
    }
    .center-label { 
        font-weight: bold; 
        color: var(--nyn-verd); 
        font-size: 11px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }

    .month-locked .select-worker, 
    .month-locked .select-hour, 
    .month-locked .sub-radio { 
        pointer-events: none !important; 
        opacity: 0.65; 
    }

    #noteModal, #deleteModal, #horesModal { 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        background: white; 
        border: 1px solid var(--border); 
        padding: 24px; 
        z-index: 2000; 
        border-radius: 12px; 
        box-shadow: var(--shadow-lg);
        font-family: inherit;
    }
    #noteModal { width: 350px; }
    #deleteModal { width: 320px; }

    #horesModal { 
        width: 90%; 
        max-width: 800px; 
        max-height: 80vh; 
        overflow-y: auto; 
    }
    
    #horesModal table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-top: 10px;
    }
    #horesModal table thead th { 
        font-size: 9px; 
        font-weight: bold; 
        background: #f1f5f9; 
        color: #475569; 
        border: 1px solid #cbd5e1;
        padding: 6px;
    }
    #horesModal table tbody td { 
        border: 1px solid #cbd5e1; 
        padding: 6px;
    }
    
    #horesModal .close-btn-top { 
        position: absolute; 
        top: 15px; 
        right: 15px; 
        background: none; 
        border: none; 
        font-size: 20px; 
        cursor: pointer; 
        color: #94a3b8;
        box-shadow: none;
        height: auto;
        padding: 0;
    }
    #horesModal .close-btn-top:hover { 
        color: #ef4444; 
    }

    .btn-tancar-resum {
        background: var(--nyn-verd) !important;
        color: white !important;
        border: 1px solid var(--nyn-verd) !important;
        padding: 6px 16px !important;
        font-weight: bold !important;
        border-radius: 6px !important;
        cursor: pointer !important;
    }
    .btn-tancar-resum:hover {
        background: #0b4e43 !important;
    }

    /* ESTILOS DE TURNOS SUSTITUCIÓN */
    .is-substitucio {
        background-color: var(--nyn-substitucio-bg) !important;
        border: 2px solid var(--nyn-substitucio-border) !important;
        border-radius: 4px;
    }
    
    .is-substitucio .select-worker, 
    .is-substitucio .select-hour {
        background-color: var(--nyn-substitucio-bg) !important;
        color: var(--nyn-substitucio-text) !important; 
        font-weight: 700;
        border: none !important;
    }

    .is-substitucio .select-worker option, 
    .is-substitucio .select-hour option {
        color: #333 !important;
        background-color: white !important;
        font-weight: normal;
    }

    .is-substitucio .sub-radio {
        accent-color: var(--nyn-substitucio-text) !important;
    }

    html, body { overflow: visible !important; height: auto !important; }
</style>

</head>
<body x-data="moduloCuadrantes()" x-init="init()" onkeydown="if(event.key==='Escape') closeAssistant();" class="bg-slate-50">

<div class="sticky-top no-print">
    <header>
        <div class="header-center">
            <span x-text="['GENER','FEBRER','MARÇ','ABRIL','MAIG','JUNY','JULIOL','AGOST','SETEMBRE','OCTUBRE','NOVEMBRE','DESEMBRE'][parseInt(filtros.mes)] + ' ' + filtros.anio"></span> 
            <span x-text="reloj" style="margin-left: 15px; font-weight: normal; opacity: 0.8;"></span>
            <span class="llegenda-vacances" data-i18n="llegendaVacances">🌴 PERÍODE VACANCIA</span>
        </div>
    </header>
    <div class="admin-panel">
        <!-- Grupo 1: Filtres de Visualització -->
        <div class="toolbar-group">
            <div class="filter-label" data-i18n="quadrantLabelPeriodo">📅 Període:</div>
            
            <select x-model="filtros.mes" @change="cargarCuadrantes()">
                <template x-for="(m, i) in ['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre']">
                    <option :value="i" x-text="m"></option>
                </template>
            </select>

            <select x-model="filtros.anio" @change="cargarCuadrantes()">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
            
            <div class="filter-label" style="margin-left: 8px;" data-i18n="quadrantLabelFiltros">🔍 Filtres:</div>
            <select x-model="filtros.parking" @change="cargarCuadrantes()">
                <option value="ALL" data-i18n="quadrantOptAllCentres">Tots els Centres</option>
                <template x-for="p in listaParkings" :key="p.nombre">
                    <option :value="p.nombre" x-text="p.nombre"></option>
                </template>
            </select>

            <select x-model="filtros.trabajador">
                <option value="ALL" data-i18n="quadrantOptAllWorkers">Tots els Treballadors</option>
                <template x-for="t in listaTrabajadores" :key="t.nombre">
                    <option :value="t.nombre" x-text="t.nombre"></option>
                </template>
            </select>

            <select x-model="filtros.horario">
                <option value="ALL" data-i18n="quadrantOptAllHours">Tots els Horaris / Torns</option>
                <optgroup label="Torns Generals">
                    <option value="T_MATÍ" data-i18n="quadrantOptMati">Només Matí</option>
                    <option value="T_TARDA" data-i18n="quadrantOptTarda">Només Tarda</option>
                    <option value="T_NIT" data-i18n="quadrantOptNit">Només Nit</option>
                </optgroup>
            </select>
            <button class="btn-main" @click="resetFilters()" data-i18n="quadrantBtnResetFilters">♻️ Reset Filtres</button>
        </div>

        <!-- Grupo 2: Accions del Cuadrante -->
        <div class="toolbar-group">
            <div class="filter-label" data-i18n="quadrantLabelAcciones">⚡ Accions:</div>
            <button class="btn-main btn-action-sec" @click="calcularHoresMes()" data-i18n="quadrantBtnRecompte">📊 Recompte Hores</button>
            <button class="btn-main" @click="openDeleteModal()" data-i18n="quadrantBtnManageData">⚙️ Gestionar Dades</button>
            <button id="btnExport" class="btn-main btn-action" @click="exportToNextMonth()" data-i18n="quadrantBtnExportNext">🚚 Exportar a ...</button>
            <button id="btnLockMonth" @click="toggleLockMonth()" :class="isMonthLocked() ? 'btn-main btn-unlock' : 'btn-main btn-lock'" x-text="isMonthLocked() ? '🔓 Obrir Mes' : '🔒 Tancar Mes'"></button>
        </div>

        <!-- Grupo 3: Exportacions Extensas -->
        <div class="toolbar-group">
            <button class="btn-main btn-action-sec" style="background:#16a34a!important; border-color:#16a34a!important;" @click="exportarExcel()">📊 Exportar Excel</button>
            <button class="btn-main btn-archive" @click="exportarBackupJSON()" data-i18n="quadrantBtnExportBackup">💾 Exportar Backup</button>
            <button class="btn-main btn-archive" @click="document.getElementById('importFile').click()" data-i18n="quadrantBtnImportBackup">📂 Importar Backup</button>
            <button class="btn-main btn-archive" @click="document.getElementById('fileVacances').click()" style="color: #7e22ce; font-weight: 600;" data-i18n="quadrantBtnImportVacances">🌴 Importar Vacances</button>
            <input type="file" id="importFile" style="display:none" accept=".json" @change="importarBackupJSON($event)">
            <input type="file" id="fileVacances" style="display:none" accept=".json" @change="importarVacances($event)">
        </div>

        <!-- Grupo 4: Zona de Perill -->
        <div class="toolbar-group danger-group">
            <button class="btn-danger-right" @click="resetAll()" data-i18n="quadrantBtnClearMonth">🗑️ Esborrar dades del mes</button>
        </div>
    </div>
</div>

<div class="flex flex-row overflow-hidden" style="display: flex; flex-direction: row; align-items: stretch; min-height: calc(100vh - 120px); width: 100%;">
    <!-- Tabla Principal de Cuadrante -->
    <div class="table-wrapper" style="flex-grow: 1; overflow-x: auto; padding: 16px 24px;">
        <table id="mainTable" :class="{ 'month-locked': isMonthLocked() }">
            <thead>
                <tr>
                    <th class="col-name" data-i18n="quadrantThHorario">HORARI</th>
                    <template x-for="day in diasDelMes">
                        <th :class="{ 'is-weekend-header': day.isWeekend, 'is-festiu-header': day.isFestiu }" x-text="day.label"></th>
                    </template>
                </tr>
            </thead>
            <tbody id="tableBody">
                <template x-for="row in matrizCuadrante" :key="row.parking + '_' + row.turno">
                    <!-- Cabecera de Parking -->
                    <tr x-show="row.turno === 'MATÍ'" class="parking-section-header">
                        <td :colspan="diasDelMes.length + 1" style="background:#f1f5f9; border-bottom: 2px solid #cbd5e1; text-align: left; padding: 6px 12px; font-weight: bold;">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" class="check-marcador" :checked="row.isPendent" @change="toggleMarcador(row.parking, $event.target.checked)">
                                <span x-text="row.parking"></span>
                            </div>
                        </td>
                    </tr>
                    <!-- Fila de Turno -->
                    <tr :class="'row-' + row.turno.toLowerCase() + ' park-row-' + row.parking.replace(/\s+/g, '_') + (row.isPendent ? ' parking-section-pendent' : '')">
                        <td class="col-name" x-text="getTranslatedTorn(row.turno)"></td>
                        
                        <!-- Celdas de Días -->
                        <template x-for="dayData in row.dias" :key="dayData.key">
                            <td :id="'cell_' + dayData.key"
                                :class="{ 'is-weekend': dayData.isWeekend, 'is-festiu': dayData.isFestiu, 'has-note': dayData.note, 'is-vacances': dayData.isVacances }"
                                :style="dayData.isVacances ? 'background-color: rgba(186, 104, 200, 0.18);' : ''"
                                @contextmenu.prevent="openNote(dayData.key)"
                                @dblclick="openAssistant(dayData.key)">
                                
                                <div class="cell-container" :class="{ 'is-substitucio': dayData.isSub }" style="pointer-events: auto;">
                                    <!-- Trabajador -->
                                    <select class="select-worker" :value="dayData.worker" @change="guardarCambio(row.parking, row.turno, dayData.dia, 'worker', $event.target.value)">
                                        <option value="-">-</option>
                                        <template x-for="t in listaTrabajadores" :key="t.nombre">
                                            <option :value="t.nombre" x-text="t.nombre" :selected="dayData.worker === t.nombre"></option>
                                        </template>
                                    </select>

                                    <!-- Horas -->
                                    <select class="select-hour" :value="dayData.hours" @change="guardarCambio(row.parking, row.turno, dayData.dia, 'hours', $event.target.value)">
                                        <template x-for="h in listaHorarios" :key="h">
                                            <option :value="h" x-text="h" :selected="dayData.hours === h"></option>
                                        </template>
                                    </select>

                                    <!-- Checkbox Sustitución -->
                                    <input type="checkbox" class="sub-radio" :checked="dayData.isSub" @change="guardarCambio(row.parking, row.turno, dayData.dia, 'isSub', $event.target.checked)">
                                </div>
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    
    <!-- PANEL DEL ASISTENTE INTELIGENTE -->
    <aside id="panel-asistente" class="hidden w-80 bg-orange-50 border-l border-orange-200 p-4 overflow-y-auto flex-shrink-0 shadow-inner" style="min-width: 320px; max-width: 320px;">
      <div class="flex justify-between items-center mb-4 border-b border-orange-200 pb-2">
        <h3 class="text-lg font-bold text-orange-800" style="margin: 0;"><i class="fas fa-robot mr-2"></i> <span data-i18n="asistenteTitle">Asistente</span></h3>
        <button @click="closeAssistant()" class="text-orange-500 hover:text-orange-800" style="background: none; border: none; font-size: 16px; cursor: pointer; padding: 0; box-shadow: none; height: auto;"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="text-sm text-gray-700 mb-4 bg-white p-2 rounded border border-orange-100" x-text="asistenteData.info">
      </div>
      
      <div class="mb-4">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit;">
              <span style="font-weight: 700; font-size: 11px; color: #475569;" data-i18n="asistenteLabelDesasignar">Desassignar torn / Deixar buit</span>
              <button @click="asignarAgenteDesdeAsistente('-')" style="background: #64748b; color: white; border: none; font-weight: 700; padding: 4px 12px; height: 26px; border-radius: 6px; font-size: 10px; cursor: pointer; box-shadow: var(--shadow-sm);" data-i18n="asistenteBtnDesasignar">
                  Desassignar
              </button>
          </div>
      </div>

      <h4 class="text-sm font-bold text-green-700 mb-2 mt-4 uppercase"><i class="fas fa-check-circle mr-1"></i> <span data-i18n="asistenteRecomendados">Recomendados</span></h4>
      <ul class="space-y-2 mb-6" style="padding-left: 0; list-style: none;">
        <template x-for="agente in asistenteData.sugeridos" :key="agente.nombre">
            <li class="bg-white p-3 rounded-lg border border-green-200 shadow-sm hover:shadow-md cursor-pointer transition-all flex flex-col gap-1.5 group relative" @click="asignarAgenteDesdeAsistente(agente.nombre)">
                <div class="flex justify-between items-start w-full">
                    <div>
                        <div class="font-bold text-gray-800 text-xs">
                            <span x-text="agente.nombre"></span>
                            <span class="text-[9px] bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded font-bold ml-2" x-show="agente.tipo === 'EMPRESA SEGURIDAD'" data-i18n="asistenteExterno">Extern</span>
                            <span class="text-[9px] bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded font-bold ml-2" x-show="agente.ranking_score >= 80">TOP</span>
                        </div>
                        <div class="text-[10px] text-gray-500 mt-0.5">
                            Ranking: <span x-text="agente.ranking_score"></span> | Horas: <span x-text="agente.dias_mes_actual * 8"></span>h
                        </div>
                    </div>
                    <button class="bg-green-600 text-white px-2 py-1 rounded text-[10px] opacity-0 group-hover:opacity-100 font-bold transition-opacity" style="border: none; padding: 3px 8px; cursor: pointer; border-radius: 4px;" data-i18n="asistenteAsignar">Asignar</button>
                </div>
            </li>
        </template>
        <template x-if="asistenteData.sugeridos.length === 0">
            <li class="text-sm text-gray-500 bg-white p-3 rounded-lg border border-gray-200 text-center" data-i18n="asistenteNoSugeridos">No hi ha suggeriments</li>
        </template>
      </ul>

      <h4 class="text-sm font-bold text-red-700 mb-2 uppercase"><i class="fas fa-ban mr-1"></i> <span data-i18n="asistenteDescartados">Descartados</span></h4>
      <ul class="space-y-2 opacity-75" style="padding-left: 0; list-style: none;">
        <template x-for="agente in asistenteData.descartados" :key="agente.nombre">
            <li class="bg-red-50/50 p-2.5 rounded-lg border border-red-100 flex flex-col gap-1 text-left">
                <div class="font-bold text-gray-700 text-xs" x-text="agente.nombre"></div>
                <div class="text-[9.5px] text-red-700 font-medium flex items-start gap-1">
                    <i class="fas fa-exclamation-triangle mt-0.5 flex-shrink-0"></i> 
                    <span x-text="agente.motivo_bloqueo || agente.motivo_descarte || 'No disponible'"></span>
                </div>
            </li>
        </template>
        <template x-if="asistenteData.descartados.length === 0">
            <li class="text-xs text-gray-400 text-center py-2" data-i18n="asistenteNoDescartados">No hi ha descarts</li>
        </template>
      </ul>
    </aside>
</div>

<!-- Modal para Observaciones/Notas -->
<div id="noteModal" x-show="showNoteModal" x-cloak>
    <h3 style="color:var(--nyn-verd); margin:0 0 10px 0;">Observacions / Nota</h3>
    <textarea x-model="noteText" style="width:100%; height:100px; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; margin-bottom:15px; outline:none;" placeholder="Escriu les notes aquí..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button @click="saveNote()" class="btn-action">Guardar</button>
        <button @click="showNoteModal = false" class="btn-archive">Tancar</button>
    </div>
</div>

<!-- Modal para Gestionar Datos -->
<div id="deleteModal" x-show="showDeleteModal" x-cloak>
    <div style="font-weight:bold; margin-bottom:10px; color:var(--nyn-verd);">GESTIONAR DADES</div>
    
    <select x-model="deleteType" style="width:100%; margin-bottom:10px;">
        <option value="personal">Personal (Llista local)</option>
        <option value="parkings">Centres (Catàleg mestre)</option>
        <option value="horaris">Horaris (Llista local)</option>
    </select>
    
    <div style="display:grid; grid-template-columns: 1fr; gap:5px; margin-top:10px;">
        <button @click="addNewItem()" class="btn-main">Afegir Nou</button>
        <button @click="showDeleteModal = false" class="btn-archive" style="margin-top: 10px;">Tancar</button>
    </div>
</div>

<!-- Modal para Resumen de Horas -->
<div id="horesModal" x-show="showHoresModal" x-cloak>
    <button @click="showHoresModal = false" class="close-btn-top">&times;</button>
    <div style="font-weight:bold; font-size:14px; margin-bottom:10px; color:var(--nyn-verd);" x-text="'RESUM D\'HORES - ' + ['GENER','FEBRER','MARÇ','ABRIL','MAIG','JUNY','JULIOL','AGOST','SETEMBRE','OCTUBRE','NOVEMBRE','DESEMBRE'][parseInt(filtros.mes)] + ' ' + filtros.anio"></div>
    
    <div style="margin-bottom:16px;">
        <div><span style="color:#666; font-size:10px;">Jornada laborable:</span> <strong style="color:#2e7d32; font-size:12px; margin-left:5px;" x-text="horesConveni + 'h'"></strong></div>
        <div style="display:flex; gap:10px; font-size:8px; font-weight:bold;"><span style="color:#4caf50;">■ DIÜRNES</span><span style="color:#9c27b0;">■ NOCTURNES</span><span style="color:#f44336;">■ FESTIVES</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="border:1px solid #ddd; padding:8px; text-align:left; width:130px;">TREBALLADOR</th>
                <th style="border:1px solid #ddd; padding:8px; text-align:center;">DISTRIBUCIÓ D'HORES</th>
                <th style="border:1px solid #ddd; padding:8px; background:#e8f5e9; width:60px;">TOTAL</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="(r, p) in resumTreballadors" :key="p">
                <tr x-show="r.total > 0">
                    <td style="border:1px solid #ddd; padding:4px 8px; font-weight:bold;" x-text="p"></td>
                    <td style="border:1px solid #ddd; padding:0 15px; position:relative; background:#fff; height:20px;">
                        <div style="width:100%; background:#f5f5f5; height:14px; display:flex; overflow:hidden; border:1px solid #eee;">
                            <div :style="'width: ' + ((r.diurnes / (horesConveni + 20)) * 100) + '%; background:#4caf50;'" style="height:100%; display:flex; align-items:center; justify-content:center; color:white; font-size:8px;" x-text="r.diurnes || ''"></div>
                            <div :style="'width: ' + ((r.nocturnes / (horesConveni + 20)) * 100) + '%; background:#9c27b0;'" style="height:100%; display:flex; align-items:center; justify-content:center; color:white; font-size:8px;" x-text="r.nocturnes || ''"></div>
                            <div :style="'width: ' + ((r.festives / (horesConveni + 20)) * 100) + '%; background:#f44336;'" style="height:100%; display:flex; align-items:center; justify-content:center; color:white; font-size:8px;" x-text="r.festives || ''"></div>
                        </div>
                    </td>
                    <td style="border:1px solid #ddd; padding:4px; text-align:center; font-weight:900; font-size:12px;" :style="r.total > horesConveni ? 'color:#d32f2f;' : 'color:#000;'" x-text="r.total + 'h'"></td>
                </tr>
            </template>
        </tbody>
    </table>
    
    <div style="margin-top:20px; text-align:right;">
        <button @click="showHoresModal = false" class="btn-tancar-resum">Tancar Resum</button>
    </div>
</div>

<script src="./js/quadrant.js"></script>
</body>
</html>
