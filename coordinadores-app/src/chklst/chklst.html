<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root { 
            --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
            --nyn-verd-accent: #008d36; /* Verde acento */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { font-family: 'Outfit', 'Segoe UI', Tahoma, sans-serif !important; }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8fafc; }
        .chklst-layout { display: flex; height: 100vh; width: 100%; }
        
        /* MENÚ LATERAL MÉS ESTRET I POLÍT */
        .chklst-menu {
            width: 180px; 
            background: #ffffff; border-right: 1px solid #e2e8f0;
            padding: 16px 12px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10;
        }
        
        /* Visor dreta amb fons corporatiu suau */
        .chklst-viewer { 
            flex-grow: 1; 
            background: #f8fafc; 
            position: relative; 
            overflow: hidden;
        }

        /* Capa superior per amagar la ruta lletja del navegador */
        .viewer-overlay {
            position: absolute; top: 0; left: 0; right: 0; height: 48px;
            background: var(--nyn-verd); color: white;
            display: flex; align-items: center; padding-left: 24px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            letter-spacing: 1px;
            border-bottom: 2px solid var(--nyn-verd-accent);
        }

        iframe#visor-contingut { 
            width: 100%; height: calc(100% - 48px); 
            border: none; margin-top: 48px;
            background: white;
        }

        /* Targetes i botons petits i VERDS */
        .card-coordinador {
            background: white; padding: 12px; border: 1px solid #e2e8f0;
            border-left: 4px solid var(--nyn-verd); border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }
        
        h3 { margin: 0 0 8px 0; font-size: 11px; color: var(--nyn-verd); text-transform: uppercase; font-weight: 700; }

        .btn-explorar {
            display: flex; align-items: center; justify-content: center;
            padding: 6px 10px; 
            background: var(--nyn-verd); 
            color: white; border: none;
            border-radius: 6px;
            font-weight: 600; font-size: 10px; cursor: pointer; text-transform: uppercase;
            width: 100%; text-decoration: none; transition: all 0.2s ease;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
        }
        
        .btn-explorar:hover { background: #0b4e43; }
        .btn-explorar span { margin-right: 4px; font-size: 11px; }

        .footer-logo { margin-top: auto; text-align: center; opacity: 0.2; padding-bottom: 5px; }
    </style>
    <script src="../js/i18n.js"></script>
    <script>
       // Forzar traducción inmediata al cargar
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
</head>
<body data-required-roles="coordinador,jefe_operaciones">
    <div class="chklst-layout">
        <div class="chklst-menu">
            <div class="card-coordinador">
                <h3>Albert Campins</h3>
                <a href="file:///P:/Parkings/COMERCIAL/OPERACIONES/Informes PKS-Checklist/Albert Campins/" target="visor-contingut" class="btn-explorar">
                    <span>📂</span> Explorar
                </a>
            </div>
            
            <div class="card-coordinador">
                <h3>Laura Navarro</h3>
                <a href="file:///P:/Parkings/COMERCIAL/OPERACIONES/Informes PKS-Checklist/Laura Navarro/" target="visor-contingut" class="btn-explorar">
                    <span>📂</span> Explorar
                </a>
            </div>
            
            <div class="card-coordinador">
                <h3>Miguel Arroyo</h3>
                <a href="file:///P:/Parkings/COMERCIAL/OPERACIONES/Informes PKS-Checklist/Miguel Arroyo/" target="visor-contingut" class="btn-explorar">
                    <span>📂</span> Explorar
                </a>
            </div>

            <div class="footer-logo">
                <img src="https://www.nyn.es/images/logo-nyn.png" alt="NyN" width="30" style="filter: grayscale(1);">
            </div>
        </div>
        
        <div class="chklst-viewer">
            <div class="viewer-overlay">Explorador de Checklists | Unitat P:</div>
            
            <iframe id="visor-contingut" name="visor-contingut" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        // Aquesta funció s'executa quan la pàgina es fa visible
        function resetVisor() {
            document.getElementById('visor-contingut').src = "about:blank";
        }

        // Escolta quan canvies entre pestanyes del navegador o quan el contenidor es carrega
        window.addEventListener('pageshow', resetVisor);
        
        // Si el teu projecte principal carrega aquest HTML dins d'un altre iframe/pestanya, 
        // aquest reset s'assegurarà que el visor estigui net en entrar.
        window.onload = resetVisor;
    </script>

<script>
  // 1. PRIMER DEFINIM LA FUNCIÓ (Sempre a dalt)
  function registrarLog(usuari, accio) {
    const ara = new Date();
    const dataFormatada = ara.toLocaleString('ca-ES', { 
        day: '2-digit', month: '2-digit', year: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
    });
    const nouLog = {
        data: dataFormatada,
        usuari: usuari.toUpperCase(),
        fitxer: "checklist.html",
        accio: accio.trim()
    };
    let logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
    logs.unshift(nouLog);
    if (logs.length > 500) logs.pop();
    localStorage.setItem('nyn_logs', JSON.stringify(logs));
  }

  // 2. AVISAR EN ENTRAR
  window.addEventListener('load', function() {
    registrarLog("SISTEMA", "CHECKLIST: Obert l'explorador de Checklists");
  });

  // 3. REGISTRAR QUIN COORDINADOR ES CONSULTA
  document.addEventListener('click', function(e) {
    // Busquem si el que s'ha clicat és el botó d'explorar
    const btn = e.target.closest('.btn-explorar');
    if (btn) {
        // Agafem el nom del coordinador que hi ha a l'H3 de la seva targeta
        const nomCoordinador = btn.closest('.card-coordinador').querySelector('h3').innerText;
        registrarLog("SISTEMA", `CHECKLIST: Consultant carpetes de -> ${nomCoordinador}`);
    }
  });

  // 4. LÒGICA VISOR (La que ja tenies)
  function resetVisor() {
    const visor = document.getElementById('visor-contingut');
    if(visor) visor.src = "about:blank";
  }
  window.addEventListener('pageshow', resetVisor);
</script>


</body>
</html>
