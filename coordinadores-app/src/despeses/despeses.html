<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Despeses de Desplaçament</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root { 
            --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
            --nyn-verd-accent: #008d36; /* Verde acento */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif !important; }

        body { 
            background: #f8fafc; margin: 0; padding: 0; font-size: 13px;
        }

        /* --- HEADER --- */
        header { 
            background-color: var(--nyn-verd) !important; 
            color: white !important; 
            padding: 8px 24px !important; 
            display: flex !important;        
            justify-content: center !important; 
            align-items: center !important; 
            height: 48px !important; 
            border-bottom: 2px solid var(--nyn-verd-accent) !important;
            box-sizing: border-box !important;
            margin-bottom: 0 !important;
            text-align: center !important;
        }
        header h1 { 
            font-size: 15px !important; 
            font-weight: 700 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 1px !important; 
            color: white !important;
            margin: 0 !important;
        }

        .card { 
            background: white; border: 1px solid var(--border); border-radius: 12px; 
            padding: 24px; box-shadow: var(--shadow-md); 
            max-width: 1000px; margin: 24px auto;
        }

        .header-flex { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            border-bottom: 2px solid var(--nyn-verd-accent); padding-bottom: 12px; margin-bottom: 16px; 
        }
        h2 { color: var(--nyn-verd); text-transform: uppercase; font-size: 15px; margin: 0; font-weight: 700; }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 16px;
            margin-bottom: 24px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: 600;
            color: #475569;
            font-size: 11px;
            text-transform: uppercase;
        }
        .form-group input {
            border: 1px solid #cbd5e1 !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
            font-size: 13px !important;
            background: #ffffff !important;
            color: #334155 !important;
            box-shadow: var(--shadow-sm) !important;
            box-sizing: border-box !important;
            height: 38px !important;
        }
        .form-group input:focus {
            border-color: var(--nyn-verd-accent) !important;
            outline: none !important;
        }

        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        th { background: #1e293b; color: white; padding: 12px; border: 1px solid #334155; text-align: left; font-size: 11px; text-transform: uppercase; font-weight: 600; }
        td { padding: 10px 12px; border: 1px solid #e2e8f0; font-size: 13px; color: #334155; }
        
        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        button {
            padding: 8px 16px !important;
            border: 1px solid var(--nyn-verd) !important;
            border-radius: 6px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            height: 38px !important;
            box-sizing: border-box !important;
            transition: all 0.2s ease !important;
            background: var(--nyn-verd) !important;
            color: #ffffff !important;
            box-shadow: var(--shadow-sm) !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: #0b4e43 !important;
            border-color: #0b4e43 !important;
        }

        @media print {
            .no-print, button, .form-grid { display: none !important; }
            .card { border: none; box-shadow: none; padding: 0; margin: 0; }
            body { background: white; }
        }
    </style>
</head>
<body>

<header class="no-print">
    <h1>Despeses de Desplaçament</h1>
</header>

<div class="card" id="mainContent" x-data="moduloGastos()" x-init="init()">
    <div class="header-flex">
        <div>
            <h2>Gestió de Despeses</h2>
        </div>
    </div>

    <!-- Formulario de Registro de Gastos -->
    <div class="form-grid no-print">
        <div class="form-group">
            <label>Concepte / Destí</label>
            <input type="text" x-model="nuevoGasto.concepto" placeholder="Ej: Compra de material, ticket de parking...">
        </div>
        <div class="form-group">
            <label>Import (€)</label>
            <input type="number" step="0.01" min="0" x-model.number="nuevoGasto.importe" placeholder="0,00">
        </div>
        <button @click="guardarGasto()">Guardar Despesa</button>
    </div>

    <!-- Tabla de Historial de Gastos -->
    <table>
        <thead>
            <tr>
                <th style="width: 150px;">FECHA</th>
                <th>CONCEPTO</th>
                <th style="width: 150px; text-align: right;">IMPORTE</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="gasto in listaGastos" :key="gasto.id">
                <tr>
                    <td x-text="gasto.fecha"></td>
                    <td x-text="gasto.concepto"></td>
                    <td style="text-align: right; font-weight: bold; color: var(--nyn-verd-accent);" x-text="parseFloat(gasto.importe).toFixed(2).replace('.', ',') + ' €'"></td>
                </tr>
            </template>
            <template x-if="listaGastos.length === 0">
                <tr>
                    <td colspan="3" style="text-align: center; color: #64748b; font-style: italic; padding: 20px;">
                        No hi ha despeses registrades per a aquest període.
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<script src="./js/despeses.js"></script>
</body>
</html>
