<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Tarifes i Comercials</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .admin-panel { 
        padding: 10px 24px; 
        display: flex; 
        flex-wrap: wrap;
        gap: 12px; 
        align-items: center; 
        border-bottom: 1px solid var(--border); 
        background: #ffffff; 
    }

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        box-shadow: var(--shadow-sm);
    }

    .filter-label { 
        font-weight: 700; 
        color: var(--nyn-verd); 
        font-size: 10px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }

    input, select, button {
        font-family: inherit;
        font-size: 11.5px;
        box-sizing: border-box;
    }

    input[type="text"], select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
        height: 28px;
    }

    input[type="text"]:focus, select:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 28px;
    }

    .btn-nyn:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    /* Tabla */
    .table-container {
        padding: 24px;
        flex: 1;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
        overflow: hidden;
    }

    th {
        background: #1e293b;
        color: white;
        font-weight: 700;
        font-size: 10.5px;
        text-transform: uppercase;
        padding: 12px 14px;
        border-bottom: 2px solid #0f172a;
        text-align: left;
    }

    td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 11.5px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }

    .form-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border: 2px solid var(--nyn-verd);
        border-radius: 12px;
        padding: 24px;
        z-index: 2000;
        box-shadow: var(--shadow-lg);
        width: 450px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1999;
    }
</style>
</head>
<body x-data="moduloComerciales()" x-init="init()">

<header>
    <div class="header-center" data-i18n="comercialsHeader"><i class="fas fa-percent mr-2"></i> TARIFES I COMERCIALS</div>
</header>

<div class="admin-panel">
    <div class="toolbar-group">
        <span class="filter-label" data-i18n="comercialsSearchLabel">Cerca:</span>
        <input type="text" x-model="busqueda" placeholder="Cerca aparcament, adreça..." data-i18n="placeholderSearch" style="width: 250px;">
    </div>
    
    <div class="toolbar-group" x-show="canEdit()">
        <button class="btn-nyn" @click="showFormNueva = true" data-i18n="btnAddNovaTarifa"><i class="fas fa-plus mr-1"></i> Nova Tarifa</button>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th width="180" data-i18n="colCentreAparcament">Centre / Aparcament</th>
                <th width="100" data-i18n="colPlazasLibres">Plazas Libres</th>
                <th width="120" data-i18n="colTarifaSingle">Tarifa</th>
                <th data-i18n="colNotasObs">Notas / Observaciones</th>
                <th x-show="canEdit()" width="110" class="text-center" data-i18n="colAcciones">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="c in comercialesFiltrados" :key="c.id">
                <tr>
                    <!-- Modo Normal -->
                    <td x-show="!c.editing" class="font-bold text-gray-800" x-text="c.aparcamiento"></td>
                    <td x-show="!c.editing" :class="getColorDP(c.vacantes)" x-text="c.vacantes"></td>
                    <td x-show="!c.editing" class="font-bold text-gray-800" x-text="c.tarifa"></td>
                    <td x-show="!c.editing" class="text-gray-500 text-xs" x-html="c.observaciones"></td>
                    <td x-show="!c.editing && canEdit()" class="text-center">
                        <button class="btn-nyn btn-secondary text-xs px-2 py-0.5 h-auto mr-1" @click="c.editing = true"><i class="fas fa-edit"></i></button>
                        <button class="btn-nyn btn-secondary text-xs px-2 py-0.5 h-auto text-red-600 border-red-200 hover:bg-red-50" @click="eliminarComercial(c.id)"><i class="fas fa-trash-alt"></i></button>
                    </td>
 
                    <!-- Modo Edición Inline -->
                    <td x-show="c.editing" x-cloak><input type="text" x-model="c.aparcamiento" style="width: 100%;"></td>
                    <td x-show="c.editing" x-cloak><input type="text" x-model="c.vacantes" style="width: 100%;"></td>
                    <td x-show="c.editing" x-cloak><input type="text" x-model="c.tarifa" style="width: 100%;"></td>
                    <td x-show="c.editing" x-cloak><input type="text" x-model="c.observaciones" style="width: 100%;"></td>
                    <td x-show="c.editing" x-cloak class="text-center">
                        <button class="btn-nyn text-xs px-2 py-0.5 h-auto mr-1" @click="guardarEdicion(c)"><i class="fas fa-check"></i></button>
                        <button class="btn-nyn btn-secondary text-xs px-2 py-0.5 h-auto" @click="c.editing = false"><i class="fas fa-times"></i></button>
                    </td>
                </tr>
            </template>
            <template x-if="comercialesFiltrados.length === 0">
                <tr>
                    <td :colspan="canEdit() ? 5 : 4" class="text-center py-8 text-gray-400">
                        <i class="fas fa-info-circle mb-1 text-lg"></i><br>
                        <span data-i18n="comercialsEmpty">No s'han trobat tarifes comercials.</span>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<!-- Modal Nueva Tarifa -->
<div class="modal-overlay" x-show="showFormNueva" @click="showFormNueva = false" x-cloak></div>
<div class="form-modal" x-show="showFormNueva" x-cloak>
    <h3 class="text-base font-bold text-gray-800 border-b pb-2 mb-2 uppercase"><i class="fas fa-plus-circle mr-1"></i> Nueva Tarifa</h3>
    
    <div class="flex flex-col gap-1">
        <label>Nombre del Aparcamiento</label>
        <input type="text" x-model="nuevaTarifa.aparcamiento" placeholder="Ej: NN BRUC">
    </div>

    <div class="flex flex-col gap-1">
        <label>Vacantes</label>
        <input type="number" x-model="nuevaTarifa.vacantes" placeholder="Ej: 0">
    </div>

    <div class="flex flex-col gap-1">
        <label>Tarifa mensual</label>
        <input type="text" x-model="nuevaTarifa.tarifa" placeholder="Ej: ±190€">
    </div>

    <div class="flex flex-col gap-1">
        <label>Notas / Observaciones</label>
        <input type="text" x-model="nuevaTarifa.observaciones" placeholder="Observaciones adicionales...">
    </div>

    <div class="flex gap-2 justify-end mt-4">
        <button class="btn-nyn btn-secondary" @click="showFormNueva = false">Cancelar</button>
        <button class="btn-nyn" @click="agregarComercial()"><i class="fas fa-save mr-1"></i> Guardar</button>
    </div>
</div>

<script src="./js/comercials.js"></script>
</body>
</html>
