<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Control de Logs</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root { 
            --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
            --nyn-verd-accent: #008d36; /* Verde acento */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --text-primari: #1e293b;
        }

        * { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif !important; }

        body {
            margin: 0; 
            font-size: 12px;
            background: #f8fafc;
            color: var(--text-primari);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- HEADER ESTILO CUADRANTE --- */
        header { 
            background-color: var(--nyn-verd) !important; 
            color: white !important; 
            padding: 8px 24px !important; 
            display: flex !important;        
            justify-content: center !important; 
            align-items: center !important; 
            height: 48px !important; 
            border-bottom: 2px solid var(--nyn-verd-accent) !important;
            box-sizing: border-box !important;
            margin-bottom: 0 !important;
            text-align: center !important;
            position: relative;
            z-index: 1000;
        }
        header h1 { 
            font-size: 15px !important; 
            font-weight: 700 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 1px !important; 
            color: white !important;
            margin: 0 !important;
        }

        .main-layout {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            height: calc(100vh - 48px);
            box-sizing: border-box;
            background: #f8fafc;
        }

        /* FILTRES LATERALS */
        .sidebar {
            flex: 0 0 240px;
            background: white;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
            box-shadow: var(--shadow-md);
        }

        /* VISTA DE CONTINGUT */
        .content-view {
            flex: 1;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-y: auto;
            padding: 0; 
            box-shadow: var(--shadow-md);
        }

        h2 { 
            margin-top: 0; 
            font-size: 12px; 
            font-weight: 700;
            color: var(--nyn-verd); 
            border-bottom: 2px solid var(--nyn-verd-accent); 
            padding-bottom: 6px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 6px; 
            font-size: 10px; 
            text-transform: uppercase; 
            color: #64748b; 
            letter-spacing: 0.5px;
        }
        
        input[type="date"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            height: 28px;
        }
        input[type="date"]:focus {
            border-color: var(--nyn-verd-accent);
        }

        .btn-nyn {
            border: none; padding: 4px 10px !important; cursor: pointer;
            font-weight: 700 !important; font-size: 11px !important; text-transform: uppercase;
            background: var(--nyn-verd) !important; color: white !important;
            transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            border-radius: 6px !important;
            height: 28px !important;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
        }
        .btn-nyn:hover { background: #0b4e43 !important; }

        /* TAULA DE LOGS */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { 
            background: #1e293b !important; color: white !important; padding: 10px 12px; border-bottom: 2px solid #0f172a !important; 
            text-align: left; text-transform: uppercase; position: sticky; top: 0; font-weight: 600;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        tr:nth-child(even) { background: #fafafa; }
        tr:hover { background: #f1f5f9; }

        .timestamp { font-weight: bold; color: var(--nyn-verd); width: 150px; white-space: nowrap; }
        .btn-delete { background: #fee2e2 !important; border: 1px solid #fecaca !important; color: #ef4444 !important; width: 100%; margin-top: 5px; }
        .btn-delete:hover { background: #fca5a5 !important; }

    </style>
    <script src="../js/i18n.js"></script>
    <script>
       // Forzar traducción inmediata al cargar
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
</head>
<body data-required-roles="coordinador,jefe_operaciones">

    <header>
        <h1 data-i18n="logHeader">Registre d'activitat del sistema (Logs)</h1>
    </header>

    <div class="main-layout">
        <div class="sidebar">
            <h2 data-i18n="logSearchFilters">Filtres de cerca</h2>
            <label data-i18n="logStartDate">Data d'inici:</label>
            <input type="date" id="dateStart">
            
            <label data-i18n="logEndDate">Data final:</label>
            <input type="date" id="dateEnd">

            <div style="display: flex; gap: 5px;">
                <button class="btn-nyn" style="flex:1;" onclick="renderLogs()" data-i18n="logSearchBtn">Cercar</button>
                <button class="btn-nyn" style="flex:1; background:#666;" onclick="resetFilters()" data-i18n="logAllBtn">Tots</button>
            </div>

            <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">
                <label data-i18n="logAdminTitle">Administració:</label>
                <button class="btn-nyn btn-delete" onclick="autoritzarEsborrat()" data-i18n="logClearPeriodBtn">🗑️ Netejar Període</button>
            </div>
        </div>

        <div class="content-view">
            <table id="logTable">
                <thead>
                    <tr>
                        <th data-i18n="logThDateTime">Data i Hora</th>
                        <th data-i18n="logThUser">USUARI</th> 
                        <th data-i18n="logThFile">FITXER</th>
                        <th data-i18n="logThDescription">Descripció de l'Acció</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </div>

<script>
    function parseLogDate(dateStr) {
        if(!dateStr) return new Date(0);
        // Suporta formats "DD/MM/YYYY" o "DD/MM/YYYY, HH:mm:ss"
        const parts = dateStr.split(',')[0].trim().split('/');
        return new Date(parts[2], parts[1] - 1, parts[0]);
    }

   
function renderLogs() {
    const body = document.getElementById('logBody'); // El teu ID original
    const logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
    const start = document.getElementById('dateStart').value;
    const end = document.getElementById('dateEnd').value;

    const startDate = start ? new Date(start) : null;
    const endDate = end ? new Date(end) : null;
    if(startDate) startDate.setHours(0,0,0,0);
    if(endDate) endDate.setHours(23,59,59,999);

    body.innerHTML = "";

    // Nota: El nou sistema ja guarda els logs amb "unshift" (els nous primer)
    // però per si de cas, mantenim el criteri de mostrar-ho tot bé
    logs.forEach(log => {
        const logDate = parseLogDate(log.data);
        let mostrar = true;
        
        if (startDate && logDate < startDate) mostrar = false;
        if (endDate && logDate > endDate) mostrar = false;

        if (mostrar) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="timestamp">${log.data}</td>
                <td style="font-weight:bold; color:#008d36;">${log.usuari || 'SISTEMA'}</td>
                <td style="color:#666; font-size:10px;">${log.fitxer || '-'}</td>
                <td>${log.accio}</td>
            `;
            body.appendChild(tr);
        }
    });

    if (body.innerHTML === "") {
        body.innerHTML = `<tr><td colspan='4' style='text-align:center; padding:50px; color:#999; font-style:italic;'>${i18n.t("logNoRecords")}</td></tr>`;
    }
}



    function autoritzarEsborrat() {
        const start = document.getElementById('dateStart').value;
        const end = document.getElementById('dateEnd').value;
        if (!start || !end) { alert(i18n.t("logSelectRangeAlert")); return; }

        if (confirm(i18n.t("logClearConfirm"))) {
            const pw = prompt(i18n.t("logSecurityKeyPrompt"));
            if (pw === "1234") {
                let logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
                const startDate = new Date(start); startDate.setHours(0,0,0,0);
                const endDate = new Date(end); endDate.setHours(23,59,59,999);

                const filtrats = logs.filter(log => {
                    const d = parseLogDate(log.data);
                    return (d < startDate || d > endDate);
                });

                localStorage.setItem('nyn_logs', JSON.stringify(filtrats));
                renderLogs();
            } else { alert(i18n.t("logIncorrectKeyAlert")); }
        }
    }

    function resetFilters() {
        document.getElementById('dateStart').value = "";
        document.getElementById('dateEnd').value = "";
        renderLogs();
    }

   window.addEventListener('storage', function(e) {
        if (e.key === 'nyn_logs') {
            renderLogs(); 
        }
    });

    window.addEventListener('focus', function() {
        renderLogs();
    });
    // --------------------------

    window.onload = renderLogs;
    window.addEventListener('languageChanged', () => {
        renderLogs();
    });
</script>
</body>
</html>
