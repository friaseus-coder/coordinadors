<script>
// --- FUNCIONS DE LLEGENDA INDEPENDENTS PER A RUTA ---

function refrescarLlegendaGlobal() {
    // Utilitzem una clau única per a RUTA
    const data = localStorage.getItem('nyn_ruta_export_data');
    const autor = localStorage.getItem('nyn_ruta_export_autor');
    const el = document.getElementById('llegendaExport');
    
    if (el) {
        if (data && autor) {
            el.innerHTML = i18n.t('rutaLegendExportPrefix') + `${data} (per ${autor})`;
        } else {
            el.innerHTML = i18n.t('rutaLegendExportNone');
        }
    }
}

function registrarLog(usuari, accio) {
    const logs = JSON.parse(localStorage.getItem('nyn_logs') || "[]");
    logs.unshift({ data: new Date().toLocaleString('ca-ES'), usuari: usuari, fitxer: "ruta.html", accio: accio });
    localStorage.setItem('nyn_logs', JSON.stringify(logs));
}

function exportarDadesUsuari(nomUsuari) {
    let dades = {};
    for (let i = 0; i < localStorage.length; i++) {
        let clau = localStorage.key(i);
        if (clau.startsWith(nomUsuari)) {
            dades[clau] = localStorage.getItem(clau);
        }
    }
    
    if (Object.keys(dades).length === 0) {
        alert("No hi ha dades guardades de " + nomUsuari);
        return;
    }

    const ara = new Date();
    const dataFormatada = ara.toLocaleString('ca-ES', { 
        day: '2-digit', month: '2-digit', year: 'numeric', 
        hour: '2-digit', minute: '2-digit' 
    });
    
    const nomSencer = localStorage.getItem('nyn_nom_empleat') || "";
    let autorLog = "SISTEMA";
    if (nomSencer.toUpperCase().includes("ALBERT")) autorLog = "ALBERT";
    else if (nomSencer.toUpperCase().includes("LAURA")) autorLog = "LAURA";

    // Afegim metadades al JSON d'exportació
    dades["METADATA_EXPORT_DATA"] = dataFormatada;
    dades["METADATA_EXPORT_AUTOR"] = autorLog;

    const blob = new Blob([JSON.stringify(dades, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ruta_${nomUsuari}_${autorLog}.json`;
    a.click();
    URL.revokeObjectURL(url);

    // GUARDEM NOMÉS EN CLAUS DE RUTA PER NO BARREJAR AMB RANKING
    localStorage.setItem('nyn_ruta_export_data', dataFormatada);
    localStorage.setItem('nyn_ruta_export_autor', autorLog);
    
    refrescarLlegendaGlobal();
    registrarLog(autorLog, `Ha exportat TOTES les rutes de ${nomUsuari}.`);
}

function importarDadesUsuari(event, nomUsuari) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const dades = JSON.parse(e.target.result);
            
            // Si el fitxer porta signatura, actualitzem la llegenda DE RUTA
            if (dades.METADATA_EXPORT_DATA) {
                localStorage.setItem('nyn_ruta_export_data', dades.METADATA_EXPORT_DATA);
                localStorage.setItem('nyn_ruta_export_autor', dades.METADATA_EXPORT_AUTOR);
            }

            let comptador = 0;
            Object.keys(dades).forEach(clau => {
                if (clau.startsWith("Albert") || clau.startsWith("Laura")) {
                    localStorage.setItem(clau, dades[clau]);
                    comptador++;
                }
            });

            await persistence.syncSave();

            alert(`✅ S'han importat ${comptador} entrades de rutes.\nAutor: ${dades.METADATA_EXPORT_AUTOR || 'Desconegut'}`);
            
            refrescarLlegendaGlobal();
            registrarLog("SISTEMA", `Importació de backup rutes (${nomUsuari}).`);
            
            generateCalendars(); 
            updateCharts(); 
            event.target.value = '';
            
        } catch (err) { 
            alert("Error en llegir el fitxer JSON."); 
        }
    };
    reader.readAsText(file);
}

// --- RESTA DE LÒGICA (CENTRES, CALENDARIS, CHARTS) SENSE CANVIS ---

const baseAddresses = ["--- >", "ARAGÓ 182", "ARIBAU 225", "AV. ROMA 120", "AV. ROMA 210", "AV. ROMA 69", "BEJAR 63", "BISBE LAGUARDA", "BONANOVA 59", "BORRELL 26", "BRUC 103", "CAP DE SETMANA", "COLLBLANC 101", "CONCEPT", "CÒRSEGA 344", "CURSO PRL", "DIA CONVENI", "DIAGONAL 593", "DOS DE MAIG 218", "ESPRONCEDA 254", "ASPY", "ESPRONCEDA 348", "ESTEVE TARRADAS 17", "FESTIU", "GEIGLE", "GRAN VÍA 641", "HERCEGOVINA 19", "LA ROTONDA", "LA TAMARITA", "LEPANTO 199", "LLIURE", "LLORENS BARBA 66", "LLULL 17", "MALLORCA 508", "MALLORCA 51", "MASTER CATALONIA", "MELCIOR PALAU", "MORAGAS 15", "MOSSOS ESQUADRA", "OFICINES", "PAU ALSINA 74", "PAU ALSINA 32", "PEDRALBES", "PONS GALLARZA", "PROVENÇA 111", "REINA AMALIA", "ROCAFORT 64", "SANTA CAROLINA", "SANTALÓ 14", "SENTMENAT 2", "SENTMENAT 54", "SEPÚLVEDA 65", "TARRAGONA 141", "TORRAS BAGES", "TRAV. GRACIA 183", "URGELL 154", "URGELL 234", "VACANCES", "VALENCIA 243", "VALENCIA 375", "VALENCIA 511", "VIA AUGUSTA 349", "ZONA FRANCA 131"];
let addresses = [];
const fixedAuxiliary = ["CAP DE SETMANA", "CURSO PRL", "DIA CONVENI", "FESTIU", "ASPY", "LLIURE", "OFICINES", "VACANCES"];

let aparcamientosInfo = []; // Array de { nombre, coordinador_responsable }

async function loadAddresses() {
    try {
        let dbApi = window.dbAPI;
        if (!dbApi && window.parent && window.parent.dbAPI) {
            dbApi = window.parent.dbAPI;
        }
        if (dbApi) {
            aparcamientosInfo = await dbApi.read('catalogos', "SELECT nombre, coordinador_responsable FROM aparcamientos WHERE activo = 1", []);
            const nombresAparcamientos = aparcamientosInfo.map(ap => ap.nombre);
            addresses = ["--- >", ...Array.from(new Set([...nombresAparcamientos, ...fixedAuxiliary]))].sort((a, b) => {
                if (a === "--- >") return -1;
                if (b === "--- >") return 1;
                return a.localeCompare(b, 'ca');
            });
        } else {
            addresses = [...new Set([...baseAddresses, ...JSON.parse(localStorage.getItem("customCenters") || "[]")])];
        }
    } catch (e) {
        console.error('Error cargando direcciones de aparcamientos:', e);
        addresses = [...new Set([...baseAddresses, ...JSON.parse(localStorage.getItem("customCenters") || "[]")])];
    }
}

const holidays = { national:["2026-01-01","2026-01-06","2026-04-03","2026-04-06","2026-05-01","2026-06-24","2026-08-15","2026-09-11","2026-10-12","2026-12-08","2026-12-25","2026-12-26"], local:["2026-05-25","2026-09-24"], convenio:["2026-06-15","2026-12-28","2026-12-29","2026-12-30","2026-12-31"], empresa:["2026-01-02","2026-04-02","2026-09-25","2026-12-07"], vigilia:["2026-01-05","2026-12-24"] };

function generateCalendars(){ generateCalendar("calendar-albert","Albert"); generateCalendar("calendar-laura","Laura"); updateCharts(); }
function generateCalendar(containerId, person){
    const container = document.getElementById(containerId); container.innerHTML = "";
    const date = new Date(monthPicker.value); const year = date.getFullYear(), month = date.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const table = document.createElement("table");
    const headerRow = document.createElement("tr");
    ["Dl","Dm","Dc","Dj","Dv","Ds","Dg"].forEach(d=>{ const th = document.createElement("th"); th.textContent = d; headerRow.appendChild(th); });
    table.appendChild(headerRow);
    let row = document.createElement("tr");
    let firstDay = new Date(year, month, 1).getDay() || 7;
    for(let i=1; i<firstDay; i++) row.appendChild(document.createElement("td"));
    for(let day=1; day<=daysInMonth; day++){
        const isoDate = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const cell = document.createElement("td");
        if((new Date(year, month, day).getDay() || 7) >= 6) cell.classList.add("weekend");
        
        if(holidays.national.includes(isoDate)) cell.classList.add("national");
        else if(holidays.local.includes(isoDate)) cell.classList.add("local");
        else if(holidays.convenio.includes(isoDate)) cell.classList.add("convenio");
        else if(holidays.empresa.includes(isoDate)) cell.classList.add("empresa");
        else if(holidays.vigilia.includes(isoDate)) cell.classList.add("vigilia");
        
        const title = document.createElement("div"); title.className = "day-number"; title.textContent = day; cell.appendChild(title);
        for(let i=0;i<6;i++){
            const key = `${person}-${year}-${month}-${day}-${i}`, nKey = `${key}-night`, hKey = `${key}-holiday`;
            const rowDiv = document.createElement("div"); rowDiv.className = "visit-row";
            const sel = document.createElement("select");
            sel.innerHTML = '<option value="">--- ></option>';
            addresses.sort((a,b)=>a.localeCompare(b,'ca')).forEach(a => { if(a !== "--- >") sel.innerHTML += `<option value="${a}">${a}</option>`; });
            const val = localStorage.getItem(key) || "";
            sel.value = val;
            
            // Pintar si es ajeno en carga inicial
            const apInfoCarga = (aparcamientosInfo || []).find(ap => ap.nombre === val);
            if (apInfoCarga && apInfoCarga.coordinador_responsable && apInfoCarga.coordinador_responsable !== person && apInfoCarga.coordinador_responsable !== 'Ambos') {
                sel.classList.add('foreign-select');
            }
            
            const nBtn = document.createElement("button"); nBtn.className = "night-btn";
            if(localStorage.getItem(nKey)){ nBtn.classList.add("active"); sel.classList.add("night-select"); }
            const hBtn = document.createElement("button"); hBtn.className = "holiday-btn";
            if(localStorage.getItem(hKey)){ hBtn.classList.add("active"); sel.classList.add("holiday-select"); }

            sel.onchange = () => {
                localStorage.setItem(key, sel.value);
                // Pintar si es ajeno en cambio manual
                const apInfo = (aparcamientosInfo || []).find(ap => ap.nombre === sel.value);
                if (apInfo && apInfo.coordinador_responsable && apInfo.coordinador_responsable !== person && apInfo.coordinador_responsable !== 'Ambos') {
                    sel.classList.add('foreign-select');
                } else {
                    sel.classList.remove('foreign-select');
                }
                updateCharts();
            };
            nBtn.onclick = () => {
                if(localStorage.getItem(nKey)){ localStorage.removeItem(nKey); nBtn.classList.remove("active"); sel.classList.remove("night-select"); }
                else { localStorage.setItem(nKey, "1"); nBtn.classList.add("active"); sel.classList.add("night-select"); }
            };
            hBtn.onclick = () => {
                if(localStorage.getItem(hKey)){ localStorage.removeItem(hKey); hBtn.classList.remove("active"); sel.classList.remove("holiday-select"); }
                else { localStorage.setItem(hKey, "1"); hBtn.classList.add("active"); sel.classList.add("holiday-select"); }
            };
            rowDiv.append(sel, hBtn, nBtn); cell.appendChild(rowDiv);
        }
        row.appendChild(cell);
        if((new Date(year, month, day).getDay() || 7) === 7){ table.appendChild(row); row = document.createElement("tr"); }
    }
    table.appendChild(row); container.appendChild(table);
}

function obrirGestio() { document.getElementById('panelGestio').style.display = 'block'; omplirGestio(); }
function omplirGestio() {
    const sel = document.getElementById("selGestio"); sel.innerHTML = "";
    addresses.filter(a => a !== "--- >").sort((a,b)=>a.localeCompare(b,'ca')).forEach(a => { sel.innerHTML += `<option value="${a}">${a}</option>`; });
}
function afegirC() {
    const nou = document.getElementById("nouNomInput").value.trim().toUpperCase();
    if(nou && !addresses.includes(nou)) {
        let custom = JSON.parse(localStorage.getItem("customCenters") || "[]"); custom.push(nou);
        localStorage.setItem("customCenters", JSON.stringify(custom));
        addresses.push(nou); document.getElementById("nouNomInput").value = ""; omplirGestio(); generateCalendars();
    }
}
function borrarC() {
    const sel = document.getElementById("selGestio").value;
    if(sel && confirm(`Eliminar ${sel}?`)) {
        let custom = JSON.parse(localStorage.getItem("customCenters") || "[]").filter(c => c !== sel);
        localStorage.setItem("customCenters", JSON.stringify(custom));
        addresses = [...new Set([...baseAddresses, ...custom])]; omplirGestio(); generateCalendars();
    }
}

let chartA, chartL;
function updateCharts(){
    const labs = addresses.filter(a=>a!=="--- >").sort();
    const [selYear, selMonth] = monthPicker.value.split("-");
    const monthIdx = parseInt(selMonth) - 1;
    const count = (p) => {
        let res = {}; labs.forEach(l=>res[l]=0);
        Object.keys(localStorage).forEach(k=>{
            if(k.startsWith(`${p}-${selYear}-${monthIdx}-`) && !k.endsWith("-night") && !k.endsWith("-holiday")){
                let v = localStorage.getItem(k); if(res[v]!==undefined) res[v]++;
            }
        });
        return labs.map(l=>res[l]);
    };
    if(chartA) chartA.destroy(); if(chartL) chartL.destroy();
    const opt = (id, label, data, col) => new Chart(document.getElementById(id), {
        type: 'bar', 
        data: {
            labels: labs, 
            datasets: [{label, data, backgroundColor: col}]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            scales: { 
                x: {
                    ticks: {
                        font: { size: 7 }, // Una mica més petita per encabir-ho tot
                        maxRotation: 90,
                        minRotation: 90,   // Força la verticalitat
                        autoSkip: false    // NO et saltis cap centre (com Rocafort)
                    }
                }, 
                y: {
                    beginAtZero: true, 
                    ticks: { stepSize: 1 }
                } 
            } 
        }
    });
    chartA = opt("chartAlbert", "Albert", count("Albert"), "rgba(54, 162, 235, 0.8)");
    chartL = opt("chartLaura", "Laura", count("Laura"), "rgba(255, 99, 132, 0.8)");
}

monthPicker.value = avui.getFullYear() + "-" + String(avui.getMonth() + 1).padStart(2, '0');

function resetMesUsuari(person) {
    const [selYear, selMonth] = monthPicker.value.split("-");
    const monthIdx = parseInt(selMonth) - 1;
    const prefixMes = `${person}-${selYear}-${monthIdx}-`;
    
    if(confirm(`⚠️ ATENCIÓ: Es perdran només les dades de ${person} del mes ${selMonth}/${selYear}.\n(La resta de mesos es mantindran).\n\nVols continuar?`)){ 
        Object.keys(localStorage).forEach(k => {
            if(k.startsWith(prefixMes)) localStorage.removeItem(k);
        });

        generateCalendars(); updateCharts(); 
    } 
}

// --- LOGICA DE RUTA AUTOMATICA CON LIMITE DE VISITAS ---
let personaAutoRuta = '';

function obrirAutoRuta(person) {
    personaAutoRuta = person;
    document.getElementById('modalAutoTitle').innerText = `Generar Ruta Automàtica (${person.toUpperCase()})`;
    document.getElementById('modalAutoRuta').style.display = 'flex';
}

function cerrarAutoRutaModal() {
    document.getElementById('modalAutoRuta').style.display = 'none';
}

async function ejecutarGeneracionAuto() {
    const person = personaAutoRuta;
    const dateStr = monthPicker.value;
    const [year, monthPart] = dateStr.split("-");
    const yearNum = parseInt(year);
    const monthIdx = parseInt(monthPart) - 1;
    
    // Obtener parámetros
    const dlVis = parseInt(document.getElementById('autoDl').value) || 0;
    const dmVis = parseInt(document.getElementById('autoDm').value) || 0;
    const dcVis = parseInt(document.getElementById('autoDc').value) || 0;
    const djVis = parseInt(document.getElementById('autoDj').value) || 0;
    const dvVis = parseInt(document.getElementById('autoDv').value) || 0;
    const wndCount = parseInt(document.getElementById('autoFinsSetmana').value) || 0;
    const wndTorn = document.getElementById('autoTornWeekend').value;
    const maxVisitas = parseInt(document.getElementById('autoMaxVisitasPorCentro').value) || 4;

    const visitasDia = [0, dlVis, dmVis, dcVis, djVis, dvVis, 0]; // 0=Dom, 1=Lun... 6=Sab

    // Obtener aparcamientos propios
    const propios = (aparcamientosInfo || []).filter(ap => 
        ap.coordinador_responsable === person || ap.coordinador_responsable === 'Ambos'
    ).map(ap => ap.nombre);

    if (propios.length === 0) {
        alert("⚠️ No s'han trobat aparcaments propis d'aquest coordinador per planificar.");
        cerrarAutoRutaModal();
        return;
    }

    // Inicializar contadores de visitas
    const visitasCount = {};
    propios.forEach(p => visitasCount[p] = 0);

    // Función inteligente de selección con límite y balanceo
    let lastSelectedIndex = -1;
    const getSiguienteAparcamientoInteligente = () => {
        // Filtrar cuáles están por debajo del límite
        let candidatos = propios.filter(p => visitasCount[p] < maxVisitas);
        
        // Si no quedan candidatos por debajo del límite, seleccionamos los que tengan el menor número de visitas registradas
        if (candidatos.length === 0) {
            let minVisits = Infinity;
            propios.forEach(p => {
                if (visitasCount[p] < minVisits) minVisits = visitasCount[p];
            });
            candidatos = propios.filter(p => visitasCount[p] === minVisits);
        }

        // De los candidatos elegibles, seleccionamos secuencialmente (rotativo) para no repetir de forma inmediata si es posible
        let chosen = candidatos[0];
        // Intentar que no sea el mismo que el anterior si hay más opciones
        if (candidatos.length > 1) {
            let nextIndex = (lastSelectedIndex + 1) % propios.length;
            let found = false;
            for (let i = 0; i < propios.length; i++) {
                let idx = (nextIndex + i) % propios.length;
                let name = propios[idx];
                if (candidatos.includes(name)) {
                    chosen = name;
                    lastSelectedIndex = idx;
                    found = true;
                    break;
                }
            }
            if (!found) {
                chosen = candidatos[0];
                lastSelectedIndex = propios.indexOf(chosen);
            }
        } else {
            chosen = candidatos[0];
            lastSelectedIndex = propios.indexOf(chosen);
        }

        visitasCount[chosen]++;
        return chosen;
    };

    const daysInMonth = new Date(yearNum, monthIdx + 1, 0).getDate();

    // Identificar fines de semana
    const finesDeSemana = [];
    let sabadoActivo = null;
    for (let day = 1; day <= daysInMonth; day++) {
        const dayOfWeek = new Date(yearNum, monthIdx, day).getDay();
        if (dayOfWeek === 6) {
            sabadoActivo = day;
        } else if (dayOfWeek === 0 && sabadoActivo !== null) {
            finesDeSemana.push({ sabado: sabadoActivo, domingo: day });
            sabadoActivo = null;
        }
    }

    const wndSeleccionados = [];
    const wndDisponibles = [...finesDeSemana];
    for (let k = 0; k < wndCount && wndDisponibles.length > 0; k++) {
        const randIndex = Math.floor(Math.random() * wndDisponibles.length);
        wndSeleccionados.push(wndDisponibles.splice(randIndex, 1)[0]);
    }

    // Confirmación
    if (!confirm(`⚠️ S'esborraran les dades actuals de la ruta de ${person} per al mes ${monthPart}/${year} i es generarà una nova ruta automàtica.\n\nVols continuar?`)) {
        return;
    }

    // 1. Limpiar datos del mes
    const prefixMes = `${person}-${yearNum}-${monthIdx}-`;
    Object.keys(localStorage).forEach(k => {
        if (k.startsWith(prefixMes)) {
            localStorage.removeItem(k);
        }
    });

    // 2. Planificar diario
    for (let day = 1; day <= daysInMonth; day++) {
        const isoDate = `${yearNum}-${String(monthIdx+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const esFestivo = holidays.national.includes(isoDate) || 
                          holidays.local.includes(isoDate) || 
                          holidays.convenio.includes(isoDate) || 
                          holidays.empresa.includes(isoDate);

        if (esFestivo) continue;

        const dayOfWeek = new Date(yearNum, monthIdx, day).getDay();
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
            const numVisitas = visitasDia[dayOfWeek];
            for (let i = 0; i < numVisitas; i++) {
                const key = `${person}-${yearNum}-${monthIdx}-${day}-${i}`;
                const ap = getSiguienteAparcamientoInteligente();
                localStorage.setItem(key, ap);
            }
        }
    }

    // Planificar fines de semana
    wndSeleccionados.forEach(wnd => {
        [wnd.sabado, wnd.domingo].forEach(day => {
            const numVisitas = 3; // Por defecto 3 visitas por día de fin de semana
            for (let i = 0; i < numVisitas; i++) {
                const key = `${person}-${yearNum}-${monthIdx}-${day}-${i}`;
                const ap = getSiguienteAparcamientoInteligente();
                localStorage.setItem(key, ap);
                
                if (wndTorn === 'nit') {
                    localStorage.setItem(`${key}-night`, "1");
                }
            }
        });
    });

    // Sincronizar en red
    await persistence.syncSave();

    alert(`✅ Ruta automàtica per a ${person} generada amb èxit!`);
    cerrarAutoRutaModal();
    generateCalendars();
    updateCharts();
}

</script>
