<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Rutes Comercials</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .main-container {
        display: flex;
        flex: 1;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
    }

    .form-panel {
        width: 380px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: fit-content;
    }

    .list-panel {
        flex: 1;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    h2 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    label {
        font-weight: 700;
        color: var(--nyn-verd);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, button {
        font-family: inherit;
        font-size: 11.5px;
        box-sizing: border-box;
    }

    input[type="text"], input[type="date"], select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        width: 100%;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="date"]:focus, select:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-nyn:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    .btn-danger-icon {
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-danger-icon:hover {
        color: #b91c1c;
    }

    /* Tabla */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f8fafc;
        color: var(--text-main);
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        padding: 10px 12px;
        border-bottom: 2px solid var(--border);
        text-align: left;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }

    .badge-parada {
        background-color: var(--nyn-verd-light);
        color: var(--nyn-verd);
        padding: 3px 8px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 9px;
        display: inline-block;
        margin-right: 4px;
        margin-bottom: 4px;
        border: 1px solid rgba(0, 141, 54, 0.2);
    }
</style>
</head>
<body x-data="moduloRutas()" x-init="init()">

<header>
    <div class="header-center"><i class="fas fa-route mr-2"></i> RUTES COMERCIALS</div>
</header>

<div class="main-container">
    <!-- Panel Izquierdo: Formulario de Nueva Ruta -->
    <div class="form-panel">
        <h2><i class="fas fa-plus-circle"></i> Nueva Ruta</h2>
        
        <div class="flex flex-col gap-1.5">
            <label>Fecha</label>
            <input type="date" x-model="nuevaRuta.fecha">
        </div>

        <div class="flex flex-col gap-1.5">
            <label>Concepto / Nombre Ruta</label>
            <input type="text" x-model="nuevaRuta.concepto" placeholder="Ej: Ruta Zona Norte, Visitas Albert...">
        </div>

        <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center mb-1">
                <label>Paradas / Aparcamientos</label>
                <button class="btn-nyn btn-secondary text-[10px] px-2 py-1 h-auto" @click="agregarParada()" style="padding: 2px 6px;">+ Añadir</button>
            </div>
            
            <div class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
                <template x-for="(parada, index) in nuevaRuta.paradas" :key="index">
                    <div class="flex gap-2 items-center">
                        <select x-model="nuevaRuta.paradas[index]" class="flex-grow">
                            <option value="">-- Selecciona Centre --</option>
                            <template x-for="p in listaParkings" :key="p">
                                <option :value="p" x-text="p"></option>
                            </template>
                        </select>
                        <button class="btn-danger-icon" @click="eliminarParada(index)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <button class="btn-nyn w-full mt-2" @click="guardarRuta()">
            <i class="fas fa-save"></i> Guardar Ruta
        </button>
    </div>

    <!-- Panel Derecho: Listado Histórico -->
    <div class="list-panel">
        <h2><i class="fas fa-history"></i> Historial de Rutes</h2>
        
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th width="100">Fecha</th>
                        <th width="100">Usuario</th>
                        <th>Concepto / Descripción</th>
                        <th>Itinerario / Paradas</th>
                        <th width="60" class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="ruta in rutas" :key="ruta.id">
                        <tr>
                            <td class="font-semibold text-gray-800" x-text="ruta.fecha"></td>
                            <td class="text-gray-600 font-medium" x-text="ruta.id_usuario"></td>
                            <td class="font-bold text-gray-700" x-text="ruta.concepto"></td>
                            <td>
                                <template x-for="p in ruta.paradas" :key="p">
                                    <span class="badge-parada" x-text="p"></span>
                                </template>
                            </td>
                            <td class="text-center">
                                <button class="btn-danger-icon" @click="eliminarRuta(ruta.id)">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </template>
                    <template x-if="rutas.length === 0">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-gray-400">
                                <i class="fas fa-info-circle mb-1 text-lg"></i><br>
                                No hay rutas comerciales registradas.
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="./js/ruta.js"></script>
</body>
</html>
