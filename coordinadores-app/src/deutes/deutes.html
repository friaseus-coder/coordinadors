<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NyN Pàrquings | Control Excés Jornada</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .main-container {
        display: flex;
        flex: 1;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
    }

    .left-panel {
        width: 380px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .form-panel, .balance-panel {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .list-panel {
        flex: 1;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    h2 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    label {
        font-weight: 700;
        color: var(--nyn-verd);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, button {
        font-family: inherit;
        font-size: 11.5px;
        box-sizing: border-box;
    }

    input[type="text"], input[type="date"], input[type="number"], select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        width: 100%;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-nyn:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-danger-icon {
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-danger-icon:hover {
        color: #b91c1c;
    }

    /* Tabla */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f8fafc;
        color: var(--text-main);
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        padding: 10px 12px;
        border-bottom: 2px solid var(--border);
        text-align: left;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }
</style>
</head>
<body x-data="moduloDeudas()" x-init="init()">

<header>
    <div class="header-center"><i class="fas fa-clock mr-2"></i> CONTROL EXCÉS JORNADA (DEUTES DE HORES)</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <!-- Registrar Ajuste -->
        <div class="form-panel">
            <h2><i class="fas fa-plus-circle"></i> Ajust de Hores</h2>
            
            <div class="flex flex-col gap-1.5">
                <label>Treballador</label>
                <select x-model="nuevaIncidencia.agente">
                    <option value="">-- Selecciona --</option>
                    <template x-for="t in listaAgentes" :key="t">
                        <option :value="t" x-text="t"></option>
                    </template>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label>Fecha</label>
                <input type="date" x-model="nuevaIncidencia.fecha">
            </div>

            <div class="flex flex-col gap-1.5">
                <label>Concepto / Tipo</label>
                <select x-model="nuevaIncidencia.tipo">
                    <option value="Bolsa Horas (+)">Bolsa Horas (+) - Suma horas al saldo</option>
                    <option value="Deuda Horas (-)">Deuda Horas (-) - Resta horas al saldo</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label>Horas</label>
                <input type="number" min="0.5" step="0.5" x-model.number="nuevaIncidencia.horas">
            </div>

            <div class="flex flex-col gap-1.5">
                <label>Comentarios / Motivo</label>
                <input type="text" x-model="nuevaIncidencia.comentarios" placeholder="Ej: Suplència, hores extres...">
            </div>

            <button class="btn-nyn w-full mt-2" @click="registrarIncidencia()">
                <i class="fas fa-save"></i> Guardar Ajust
            </button>
        </div>

        <!-- Balance Global -->
        <div class="balance-panel">
            <h2><i class="fas fa-balance-scale"></i> Balanç de Treballadors</h2>
            <div class="flex flex-col gap-2 max-h-80 overflow-y-auto pr-1">
                <template x-for="(bal, name) in balances" :key="name">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-1.5 text-xs">
                        <span class="font-bold text-gray-700" x-text="name"></span>
                        <span class="px-2 py-0.5 rounded font-bold" 
                              :class="{
                                  'bg-green-100 text-green-800': bal > 0,
                                  'bg-red-100 text-red-800': bal < 0,
                                  'bg-gray-100 text-gray-500': bal === 0
                              }"
                              x-text="bal > 0 ? '+' + bal + 'h' : bal + 'h'"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Panel Derecho: Listado Histórico -->
    <div class="list-panel">
        <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-2">
            <h2><i class="fas fa-history"></i> Historial d'Ajustos</h2>
            
            <div class="flex gap-2">
                <select x-model="filtros.agente" style="width: 160px; height: 26px;">
                    <option value="ALL">Tots els agents</option>
                    <template x-for="t in listaAgentes" :key="t">
                        <option :value="t" x-text="t"></option>
                    </template>
                </select>

                <select x-model="filtros.tipo" style="width: 160px; height: 26px;">
                    <option value="ALL">Tots els tipus</option>
                    <option value="Bolsa Horas (+)">Bolsa Horas (+)</option>
                    <option value="Deuda Horas (-)">Deuda Horas (-)</option>
                </select>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th>Treballador</th>
                        <th width="100">Fecha</th>
                        <th width="150">Ajuste</th>
                        <th width="80" class="text-right">Horas</th>
                        <th>Coordinador</th>
                        <th>Comentarios / Motivo</th>
                        <th width="60" class="text-center">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="inc in incidenciasFiltradas" :key="inc.id">
                        <tr>
                            <td class="font-bold text-gray-800" x-text="inc.id_trabajador"></td>
                            <td x-text="inc.fecha_inicio"></td>
                            <td>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                      :class="{
                                          'bg-green-100 text-green-800': inc.tipo_incidencia === 'Bolsa Horas (+)',
                                          'bg-red-100 text-red-800': inc.tipo_incidencia === 'Deuda Horas (-)'
                                      }" x-text="inc.tipo_incidencia"></span>
                            </td>
                            <td class="text-right font-bold text-gray-900" x-text="inc.impacto_horas + 'h'"></td>
                            <td class="text-gray-600 font-semibold" x-text="inc.coordinador"></td>
                            <td class="text-gray-500" x-text="inc.comentarios || '-'"></td>
                            <td class="text-center">
                                <button class="btn-danger-icon" @click="eliminarIncidencia(inc.id)">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </template>
                    <template x-if="incidenciasFiltradas.length === 0">
                        <tr>
                            <td colspan="7" class="text-center py-8 text-gray-400">
                                <i class="fas fa-info-circle mb-1 text-lg"></i><br>
                                No hay registros de ajuste de horas.
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="./js/deutes.js"></script>
</body>
</html>
