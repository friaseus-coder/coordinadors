<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valoració Agents (RANKING) </title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ---------------- HEADER ---------------- -->
  <header>
    <h1>Valoració Agents (RANKING) </h1>
  </header>

<!-- ---------------- GRÀFIQUES ---------------- -->
<div class="charts-container" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
  
  <!-- Gràfic 1: Mitjana per centre -->
  <div class="chart-box">
    <h2>Mitjana per centre</h2>
    <canvas id="centreChart"></canvas>
  </div>

  <!-- Gràfic 2: Volum aptituds (Scatter) -->
  <div class="chart-box">
    <h2>Volum aptituds</h2>
    <canvas id="scatterChart"></canvas>
  </div>

  <!-- Gràfic 3: Rendiment jeràrquic -->
<div class="chart-box">
  <h2>Comparativa rendiment</h2>
  <div id="sunburstChart" style="width:100%; height:500px;"></div>
</div>

</div>


  <!-- ---------------- CONTROLS ---------------- -->
  <div class="controls">
    <select id="filterZona">
      <option value="">Totes les zones</option>
      <option value="Zona 1">Zona 1</option>
      <option value="Zona 2">Zona 2</option>
      <option value="Zona 3">Zona 3</option>
    </select>

    <select id="filterCentre">
      <option value="">Tots els centres</option>
    </select>

    <select id="filterTorn">
      <option value="">Tots els torns</option>
    </select>

    <select id="filterNota">
      <option value="">Totes les notes</option>
    </select>

    <input type="text" id="search" placeholder="Cerca per agent...">
  </div>

<!-- ---------------- BOTONS VISTA ---------------- -->
<div class="botons-vista" style="display:flex; align-items:center; margin-bottom:0px; gap:5px;">

  <!-- BOTONS -->
  <button id="btnTableView" class="boton-accio">Mostrar Taula</button>
  <button id="btnCardView" class="boton-accio">Mostrar Targetes</button>

  <!-- COMPTADOR -->
  <span id="workerCount" style="margin-left:15px; font-weight:bold; font-size:0.9em; color:#23631f;">
    Nº Treballadors: 0
  </span>

  <!-- LOGO A LA DRETA -->
  <img src="logo.png" alt="Logo Empresa" id="logoVista" 
       style="height:50px; margin-left:auto; position: relative; top: -10px;">
  
</div>



  <!-- ---------------- TAULA ---------------- -->
  <div id="tableContainer">
    <table id="tableView">

      <thead>
        <tr>
          <th></th>
          <th>Agent</th>
          <th>Centre</th>
          <th>Societat</th>
          <th>Torn</th>
          <th>Zona</th>
          <th>Coneixements</th>
          <th>Atenció</th>
          <th>Disponibilitat</th>
          <th>Actitud</th>
          <th>Valoració</th>
          <th>Observacions</th>
        </tr>
      </thead>

       <!-- Afegeix id al tbody -->
  <tbody id="tableBody">
  </tbody>

 <tfoot>
  <tr>
    <td colspan="13" style="text-align:left; padding:10px 0;">
      <button id="addRowBtn">+ Afegir fila</button>
    </td>
  </tr>
  <tr>
    <td colspan="13" class="footer">
      nn parkings 2026 v1.0 beta
    </td>
  </tr>
</tfoot>

</table>
  </div>

  <!-- ---------------- TARGETES ---------------- -->
  <div id="cardsContainer" style="display:none;"></div>

  <!-- ---------------- SCRIPTS ---------------- -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script> 
  <script src="js/app.js"></script>

</body>
</html>
