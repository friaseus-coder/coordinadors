<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyN Pàrquings | Rànquing d'Agents</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <script src="../js/persistence.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="js/charts.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', () => {
           if(typeof applyTranslations === 'function') applyTranslations();
       });
    </script>
    
<style>
    [x-cloak] { display: none !important; }

    :root {
        --nyn-verd: #063931;       /* Verde pino oscuro corporativo */
        --nyn-verd-accent: #008d36; /* Verde acento */
        --border: #e2e8f0;
        --text-main: #0f2d4a;
        --text-muted: #64748b;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; 
        background: #f8fafc; 
        color: #1e293b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    header { 
        background-color: var(--nyn-verd); 
        color: white; 
        padding: 8px 24px; 
        display: flex;        
        justify-content: center; 
        align-items: center; 
        height: 48px; 
        border-bottom: 2px solid var(--nyn-verd-accent);
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .header-center { 
        font-size: 15px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }

    .admin-panel { 
        padding: 10px 24px; 
        display: flex; 
        flex-wrap: wrap;
        gap: 12px; 
        align-items: center; 
        border-bottom: 1px solid var(--border); 
        background: #ffffff; 
        flex-shrink: 0;
    }

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        box-shadow: var(--shadow-sm);
    }

    .filter-label { 
        font-weight: 700; 
        color: var(--nyn-verd); 
        font-size: 10px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }

    input, select, button {
        font-family: inherit;
        font-size: 11px;
        box-sizing: border-box;
        height: 28px;
    }

    input[type="text"], select {
        padding: 4px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
        border-color: var(--nyn-verd-accent);
    }

    .btn-nyn {
        background: var(--nyn-verd);
        color: white;
        border: 1px solid var(--nyn-verd);
        font-weight: 700;
        padding: 4px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-nyn:hover {
        background: #0b4e43;
        border-color: #0b4e43;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    .btn-danger-icon {
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-danger-icon:hover {
        color: #b91c1c;
    }

    /* Tabla */
    .table-container {
        padding: 24px;
        flex: 1;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
        overflow: hidden;
    }

    th {
        background: #1e293b;
        color: white;
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        padding: 10px 12px;
        border-bottom: 2px solid #0f172a;
        text-align: left;
    }

    td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        vertical-align: middle;
    }

    tr:hover td {
        background-color: #f8fafc;
    }

    /* Cards Grid */
    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        padding: 24px;
    }

    .card-agent {
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
</style>
</head>
<body x-data="moduloRanking()" x-init="init()">

<header>
    <div class="header-center" data-i18n="rankingTitle"><i class="fas fa-star mr-2"></i> RÀNQUING I VALORACIÓ D'AGENTS</div>
</header>

<div class="admin-panel">
    <div class="toolbar-group">
        <span class="filter-label" data-i18n="chklstExplorar">Cerca:</span>
        <input type="text" x-model="busqueda" placeholder="Cerca per agent..." data-i18n="rankingSearchPlaceholder" style="width: 200px;">
    </div>

    <div class="toolbar-group">
        <span class="filter-label" data-i18n="rankingLabelFiltres">Filtres:</span>
        <select x-model="filtros.centre">
            <option value="" data-i18n="rankingAllCentres">Tots els centres</option>
            <template x-for="c in centresUnics" :key="c">
                <option :value="c" x-text="c"></option>
            </template>
        </select>

        <select x-model="filtros.torn">
            <option value="" data-i18n="rankingAllTorns">Tots els torns</option>
            <template x-for="t in opcionsTorn" :key="t">
                <option :value="t" x-text="t"></option>
            </template>
        </select>

        <select x-model="filtros.zona">
            <option value="" data-i18n="rankingAllZones">Totes les zones</option>
            <template x-for="z in opcionsZona" :key="z">
                <option :value="z" x-text="z"></option>
            </template>
        </select>

        <select x-model="filtros.nota">
            <option value="" data-i18n="rankingAllNotes">Totes les notes</option>
            <template x-for="n in notesOptions" :key="n.value">
                <option :value="n.value" x-text="n.label"></option>
            </template>
        </select>
    </div>

    <div class="toolbar-group">
        <button class="btn-nyn btn-secondary" @click="viewMode = 'table'" :class="viewMode === 'table' ? 'bg-slate-200' : ''" data-i18n="rankingBtnShowTable"><i class="fas fa-table"></i> Tabla</button>
        <button class="btn-nyn btn-secondary" @click="viewMode = 'card'" :class="viewMode === 'card' ? 'bg-slate-200' : ''" data-i18n="rankingBtnShowCards"><i class="fas fa-th-large"></i> Cards</button>
    </div>

    <div class="toolbar-group" x-show="userRole === 'jefe operaciones'">
        <button class="btn-nyn" @click="afegirFila()" data-i18n="rankingAddRow"><i class="fas fa-plus mr-1"></i> Afegir Fila</button>
    </div>

    <div class="toolbar-group" style="margin-left: auto;">
        <button class="btn-nyn btn-secondary" @click="exportarBackupJSON()" data-i18n="vacancesExportJSON"><i class="fas fa-download mr-1"></i> Exportar</button>
        <button class="btn-nyn btn-secondary" @click="document.getElementById('importFile').click()" data-i18n="vacancesImportJSON"><i class="fas fa-upload mr-1"></i> Importar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" @change="importarBackupJSON($event)">
    </div>
</div>

<!-- GRÀFICS DE RÀNQUING (En línia/Grid) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 flex-shrink-0" x-show="viewMode === 'table'" style="background: #f8fafc;">
    <!-- Gràfic 1: Mitjana per centre -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
        <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide" data-i18n="rankingChartAverageCentre">Mitjana per centre</h3>
        <div style="width: 100%; height: 220px; position: relative;">
            <canvas id="centreChart"></canvas>
        </div>
    </div>

    <!-- Gràfic 2: Volum aptituds (Scatter/Bubble) -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
        <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide" data-i18n="rankingChartAptitudeVolume">Volum aptituds</h3>
        <div style="width: 100%; height: 220px; position: relative;">
            <canvas id="scatterChart"></canvas>
        </div>
    </div>

    <!-- Gràfic 3: Comparativa rendiment (Radar ECharts) -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
        <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide" data-i18n="rankingChartPerformanceCompare">Comparativa rendiment</h3>
        <div id="sunburstChart" style="width: 100%; height: 220px; width: 100%;"></div>
    </div>
</div>

<!-- VISTA TABLA -->
<div class="table-container" x-show="viewMode === 'table'">
    <table>
        <thead>
            <tr>
                <th width="50" class="text-center" data-i18n="rankingThPosicio">Ordre</th>
                <th data-i18n="rankingThAgent">Treballador / Agent</th>
                <th data-i18n="rankingThCentre">Centre</th>
                <th data-i18n="rankingThSocietat">Societat</th>
                <th width="90" data-i18n="rankingThTorn">Torn</th>
                <th width="80" data-i18n="rankingThZona">Zona</th>
                <th width="60" class="text-center" data-i18n="rankingThConeixements">Coneix.</th>
                <th width="60" class="text-center" data-i18n="rankingThAtencio">Atenció</th>
                <th width="60" class="text-center" data-i18n="rankingThDisponibilitat">Dispo.</th>
                <th width="60" class="text-center" data-i18n="rankingThActitud">Actitud</th>
                <th width="70" class="text-center" data-i18n="rankingThValoracio">Valoració</th>
                <th data-i18n="rankingThObservacions">Observacions</th>
                <th x-show="userRole === 'jefe operaciones'" width="50" class="text-center" data-i18n="colCobAcciones">Acció</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="(d, index) in dadesFiltrades" :key="d.agent">
                <tr :style="getRowColor(d.valoracio)">
                    <td class="text-center font-bold text-gray-500" x-text="index + 1"></td>
                    <td>
                        <input type="text" x-model="d.agent" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent; font-weight: bold;">
                    </td>
                    <td>
                        <input type="text" x-model="d.centre" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td>
                        <input type="text" x-model="d.societat" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td>
                        <select x-model="d.torn" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent; height: 22px;">
                            <template x-for="t in opcionsTorn" :key="t">
                                <option :value="t" x-text="t" :selected="d.torn === t"></option>
                            </template>
                        </select>
                    </td>
                    <td>
                        <select x-model="d.zona" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent; height: 22px;">
                            <template x-for="z in opcionsZona" :key="z">
                                <option :value="z" x-text="z" :selected="d.zona === z"></option>
                            </template>
                        </select>
                    </td>
                    <td>
                        <input type="number" min="0" max="10" x-model.number="d.coneixements" @input="recalcularValoracio(d)" :disabled="userRole !== 'jefe operaciones'" class="text-center" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td>
                        <input type="number" min="0" max="10" x-model.number="d.atencio" @input="recalcularValoracio(d)" :disabled="userRole !== 'jefe operaciones'" class="text-center" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td>
                        <input type="number" min="0" max="10" x-model.number="d.disponibilitat" @input="recalcularValoracio(d)" :disabled="userRole !== 'jefe operaciones'" class="text-center" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td>
                        <input type="number" min="0" max="10" x-model.number="d.actitud" @input="recalcularValoracio(d)" :disabled="userRole !== 'jefe operaciones'" class="text-center" style="width: 100%; border: none; background: transparent;">
                    </td>
                    <td class="text-center">
                        <span :class="getRatingClass(d.valoracio)" x-text="d.valoracio"></span>
                    </td>
                    <td>
                        <input type="text" x-model="d.observacions" @change="guardar()" :disabled="userRole !== 'jefe operaciones'" style="width: 100%; border: none; background: transparent; font-size: 10.5px;">
                    </td>
                    <td x-show="userRole === 'jefe operaciones'" class="text-center">
                        <button class="btn-danger-icon" @click="borrarFila(dades.indexOf(d))">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<!-- VISTA CARDS -->
<div class="cards-grid" x-show="viewMode === 'card'" x-cloak>
    <template x-for="(d, index) in dadesFiltrades" :key="d.agent">
        <div class="card-agent" :style="getRowColor(d.valoracio)">
            <div class="flex justify-between items-start border-b pb-1.5 mb-1.5">
                <span class="text-gray-400 font-bold" x-text="'#' + (index + 1)"></span>
                <span :class="getRatingClass(d.valoracio)" class="text-base" x-text="d.valoracio"></span>
            </div>
            <div class="font-bold text-gray-800 text-sm" x-text="d.agent"></div>
            <div class="text-xs text-gray-600"><i class="fas fa-parking mr-1 text-slate-400"></i> <span x-text="d.centre"></span></div>
            <div class="text-xs text-gray-500"><i class="fas fa-building mr-1 text-slate-400"></i> <span x-text="d.societat"></span></div>
            
            <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                <div><strong x-text="i18n.t('rankingThTorn') + ':'">Torn:</strong> <span x-text="d.torn"></span></div>
                <div><strong x-text="i18n.t('rankingThZona') + ':'">Zona:</strong> <span x-text="d.zona"></span></div>
                <div><strong x-text="i18n.t('rankingThConeixements') + ':'">Coneix.:</strong> <span x-text="d.coneixements"></span>/10</div>
                <div><strong x-text="i18n.t('rankingThAtencio') + ':'">Atenció:</strong> <span x-text="d.atencio"></span>/10</div>
                <div><strong x-text="i18n.t('rankingThDisponibilitat') + ':'">Dispo.:</strong> <span x-text="d.disponibilitat"></span>/10</div>
                <div><strong x-text="i18n.t('rankingThActitud') + ':'">Actitud:</strong> <span x-text="d.actitud"></span>/10</div>
            </div>
            
            <div class="mt-2 text-[10.5px] text-gray-500 italic border-t pt-1.5" x-text="d.observacions || 'Sense observacions.'"></div>
        </div>
    </template>
</div>

<script src="js/data.js"></script>
<script src="js/ranking.js"></script>
</body>
</html>
